; Memeshift Player — raises upload limits for upload.php's MP3/art uploads.
; Keep in sync with MAX_UPLOAD_MB / MAX_ART_MB in config.php (this sets the
; PHP-level ceiling; config.php enforces the app-level limit below it).
upload_max_filesize = 300M
post_max_size = 310M
max_execution_time = 120
max_input_time = 600
memory_limit = 128M
