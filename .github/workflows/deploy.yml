name: Deploy MPlayer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options: [test, production]
        default: test

jobs:
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to music.memeshift.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_MUSIC }}
          username: ${{ secrets.FTP_USER_MUSIC }}
          password: ${{ secrets.FTP_PASS_MUSIC }}
          protocol: ftps
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**

  deploy-test:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test.memeshift.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_TEST }}
          username: ${{ secrets.FTP_USER_TEST }}
          password: ${{ secrets.FTP_PASS_TEST }}
          protocol: ftps
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to sxseplayer.memeshift.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_SXSE }}
          username: ${{ secrets.FTP_USER_SXSE }}
          password: ${{ secrets.FTP_PASS_SXSE }}
          protocol: ftps
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
      - name: Deploy to maumo.memeshift.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_MAUMO }}
          username: ${{ secrets.FTP_USER_MAUMO }}
          password: ${{ secrets.FTP_PASS_MAUMO }}
          protocol: ftps
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
