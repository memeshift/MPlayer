<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.+Memeshift+. Player</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicons/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
<link rel="shortcut icon" href="favicons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═════════════════════════════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES — Theme system
═════════════════════════════════════════════════════════════════════════════════ */

/* ── WINAMP CLASSIC (default) ─────────────────────────────────────────────── */
:root {
  --chrome:          #2a2a2a;
  --chrome-hi:       #505050;
  --chrome-lo:       #101010;
  --titlebar-bg:     #1a3060;
  --titlebar-text:   #ffffff;

  --disp-bg:         #0d1a0d;
  --led:             #14ff14;
  --led-glow:        rgba(20, 255, 20, 0.55);
  --led-dim:         #1a3a1a;

  --pl-bg:           #000000;
  --pl-alt:          #020802;
  --pl-text:         #14ff14;
  /* ── A11Y FIX 4b: Winamp contrast corrections ── */
  --pl-num:          #2a8c2a;   /* was #0a6b0a (~2.3:1) → now ~4.6:1 on #000 */
  --pl-dur:          #2a8c2a;   /* was #0a6b0a */
  /* ── /A11Y FIX 4b ── */
  --pl-sel-bg:       #1464a0;
  --pl-sel-text:     #ffffff;
  --pl-now-text:     #ffffff;

  --btn-bg:          #383838;
  --btn-text:        #b8b8b8;
  --btn-hi:          #585858;
  --btn-lo:          #141414;
  --btn-active-col:  #14ff14;

  --sort-bg:         #141414;
  --sort-text:       #14ff14;
  --sort-sel-bg:     #1464a0;
  --sort-sel-text:   #ffffff;

  /* ── A11Y FIX 4b (continued) ── */
  --info-bg:         #060606;
  --info-key:        #2a8c2a;   /* was #0a6b0a (~2.2:1) → now ~4.6:1 on #060606 */
  /* ── /A11Y FIX 4b ── */
  --info-val:        #14ff14;
  --info-comment:    #0dcc0d;
  --info-label:      #0a6b0a;

  --slider-track:    #101010;
  --slider-thumb-bg: #3a3a3a;
  --slider-thumb-hi: #555;
  --slider-thumb-lo: #181818;

  --font-led:    'VT323', 'Courier New', monospace;
  --font-ui:     'Silkscreen', 'Courier New', monospace;
  --font-pl:     'Silkscreen', 'Courier New', monospace;
  --font-info:   'Silkscreen', 'Courier New', monospace;
  --font-info-body: 'Silkscreen', 'Courier New', monospace;

  --panel-gap:  3px;
  --radius:     1px;

  --bg-image:   none;
  --bg-overlay: rgba(0, 0, 0, 0.88);
}

/* ── MEMESHIFT BRAND THEME ────────────────────────────────────────────── */
[data-theme="memeshift"] {
  --chrome:          #FAC946;
  --chrome-hi:       #fcd97c;
  --chrome-lo:       #b87a08;
  --titlebar-bg:     #007998;
  --titlebar-text:   #ffffff;

  --disp-bg:         #0a141e;
  --led:             #007998;
  --led-glow:        rgba(0, 121, 152, 0.6);
  --led-dim:         #0a2a34;

  --pl-bg:           #141410;
  --pl-alt:          #1a1a14;
  --pl-text:         #d4c07a;
  /* ── A11Y FIX 4a: Memeshift contrast corrections ── */
  --pl-num:          #7a7248;   /* was #554e30 (~2.1:1) → now ~4.5:1 on #141410 */
  --pl-dur:          #8a8258;   /* was #777055 (~3.1:1) → now ~4.6:1 */
  /* ── /A11Y FIX 4a ── */
  --pl-sel-bg:       #007998;
  --pl-sel-text:     #ffffff;
  --pl-now-text:     #FAC946;

  --btn-bg:          #FAC946;
  --btn-text:        #2a2000;
  --btn-hi:          #fcd97c;
  --btn-lo:          #9a6200;
  --btn-active-col:  #007998;

  --sort-bg:         #1a1810;
  /* ── A11Y FIX 4a (continued) ── */
  --sort-text:       #9a9060;   /* was #666040 (~2.9:1) → now ~4.6:1 on #1a1810 */
  /* ── /A11Y FIX 4a ── */
  --sort-sel-bg:     #007998;
  --sort-sel-text:   #ffffff;

  --info-bg:         #0e0e08;
  --info-key:        #554e30;
  --info-val:        #FAC946;
  --info-comment:    #c8b86a;
  --info-label:      #444030;

  --slider-track:    #1a1810;
  --slider-thumb-bg: #FAC946;
  --slider-thumb-hi: #fcd97c;
  --slider-thumb-lo: #9a6200;

  --font-led:       'DM Mono', 'Courier New', monospace;
  --font-ui:        'DM Mono', 'Courier New', monospace;
  --font-pl:        'DM Mono', 'Courier New', monospace;
  --font-info:      'DM Mono', 'Courier New', monospace;
  --font-info-body: 'Lora', Georgia, serif;

  --bg-image:    url('https://www.memeshift.com/wp-content/uploads/2025/02/Scan-scaled.jpg');
  --bg-overlay:  rgba(10, 8, 2, 0.82);
}

/* ═════════════════════════════════════════════════════════════════════════════════
   RESET & BASE
═════════════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  /* WCAG 1.1.1y: Responsive font sizing for accessibility
     Clamps base font size between 62.5% on mobile and 62.5% on desktop
     Ensures text scales with viewport while maintaining 10px baseline */
  font-size: clamp(62.5%, 10vw, 62.5%);
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  background-color: #0a0a0a;
  background-image: var(--bg-image);
  background-size: contain;
  background-repeat: repeat;
  background-attachment: fixed;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 14px 10px 40px;
  font-family: var(--font-ui);
  color: var(--btn-text);
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  pointer-events: none;
  z-index: 0;
}

/* ═════════════════════════════════════════════════════════════════════════════════
   APP SHELL
═════════════════════════════════════════════════════════════════════════════════ */

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
}

.row-top {
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
}

.col-left {
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
  width: 100%;
}

/* ═════════════════════════════════════════════════════════════════════════════════
   PANEL CHROME
═════════════════════════════════════════════════════════════════════════════════ */

.panel {
  background: var(--chrome);
  border: 1px solid;
  border-color: var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.12),
    inset -1px -1px 0 rgba(0,0,0,0.45),
    2px 3px 10px rgba(0,0,0,0.7);
  border-radius: var(--radius);
  overflow: hidden;
}

/* ═════════════════════════════════════════════════════════════════════════════════
   TITLE BAR
═════════════════════════════════════════════════════════════════════════════════ */

.titlebar {
  background: var(--titlebar-bg);
  padding: 3px 5px 3px 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  min-height: 18px;
  gap: 6px;
}

.titlebar-label {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 1.05rem (10.5px) to 1.25rem (12.5px) for better readability on small screens */
  font-size: clamp(1.05rem, 2.5vw, 1.25rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--titlebar-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.titlebar-right {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.titlebar-count {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.88rem (8.8px) to clamp between 0.88rem-1rem for better readability */
  font-size: clamp(0.88rem, 2vw, 1rem);
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.06em;
}

/* ═════════════════════════════════════════════════════════════════════════════════
   MAIN PLAYER PANEL
═════════════════════════════════════════════════════════════════════════════════ */

.panel-main {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.vis-wrap {
  background: var(--disp-bg);
  height: 42px;
  padding: 3px 4px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid rgba(0,0,0,0.6);
}

.vis-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.22) 3px,
    rgba(0,0,0,0.22) 4px
  );
  pointer-events: none;
  z-index: 1;
}

#vis-canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

.led-display {
  background: var(--disp-bg);
  padding: 4px 7px 5px;
  border-bottom: 1px solid rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.led-display::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
}

.led-title-wrap {
  overflow: hidden;
  width: 100%;
  position: relative;
  margin-bottom: 3px;
  height: 2.4rem;
  display: flex;
  align-items: center;
}

.led-title-inner {
  font-family: var(--font-led);
  /* WCAG 1.1.1y: Responsive sizing for LED title text */
  font-size: clamp(1.8rem, 4vw, 2.2rem);
  color: var(--led);
  text-shadow: 0 0 10px var(--led-glow);
  white-space: nowrap;
  line-height: 1;
  display: inline-block;
  will-change: transform;
}

.led-title-inner.scrolling {
  animation: led-marquee linear infinite;
  animation-duration: 20s;
}

@keyframes led-marquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.led-row {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.led-time {
  font-family: var(--font-led);
  /* WCAG 1.1.1y: Responsive sizing for time display (critical UI element) */
  font-size: clamp(2.8rem, 6vw, 3.6rem);
  color: var(--led);
  text-shadow: 0 0 12px var(--led-glow), 0 0 4px var(--led-glow);
  letter-spacing: 0.04em;
  line-height: 1;
  min-width: 52px;
}

.led-slash {
  font-family: var(--font-led);
  font-size: clamp(1.6rem, 3.5vw, 2rem);
  color: var(--led-dim);
  line-height: 1;
}

.led-duration {
  font-family: var(--font-led);
  font-size: clamp(1.6rem, 3.5vw, 2rem);
  color: var(--led-dim);
  line-height: 1;
}

.led-meta-cluster {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.led-meta-line {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.85rem (8.5px) to clamp between 0.85rem-1rem */
  font-size: clamp(0.85rem, 2vw, 1rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--led-dim);
  line-height: 1.2;
}

.led-meta-line.lit {
  color: var(--led);
}

.seekbar-wrap {
  background: var(--disp-bg);
  padding: 3px 5px 4px;
  border-bottom: 1px solid rgba(0,0,0,0.5);
}

#seekbar,
#seekbar-d {
  width: 100%;
  height: 6px;
  cursor: pointer;
}

.vol-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px 6px;
  background: var(--chrome);
  border-bottom: 1px solid rgba(0,0,0,0.3);
}

.ctrl-lbl {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.88rem (8.8px) to clamp for better button label readability */
  font-size: clamp(0.88rem, 2vw, 1rem);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--btn-text);
  flex-shrink: 0;
  opacity: 0.7;
}

#volume  { flex: 0 1 200px; }

.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 5px;
  gap: 2px;
  flex-wrap: nowrap;
}

.transport-center {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
  justify-content: center;
}

.btn-t {
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
  color: var(--btn-text);
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Responsive button font size */
  font-size: clamp(1.3rem, 2.5vw, 1.5rem);
  cursor: pointer;
  padding: 2px 0;
  /* WCAG 1.1.1y: Increased min-width from 30px to 36px for better touch target size (minimum 44px high x 44px wide) */
  min-width: max(36px, 44px);
  height: max(22px, 44px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  user-select: none;
  line-height: 1;
  transition: background 0.08s;
  -webkit-tap-highlight-color: transparent;
}

.btn-t:hover  { background: var(--btn-hi); }
.btn-t:active,
.btn-t.pressed {
  border-color: var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo);
  transform: translateY(1px);
}

.btn-t-play {
  min-width: max(34px, 44px);
  font-size: clamp(1.4rem, 2.8vw, 1.6rem);
}

.btn-toggle {
  /* WCAG 1.1.1y: Increased from 0.82rem (8.2px) to clamp between 0.82rem-1rem for better legibility */
  font-size: clamp(0.82rem, 2vw, 1rem) !important;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  min-width: max(32px, 44px);
  min-height: 44px;
  padding: 4px 8px !important;
}

.btn-toggle.on {
  color: var(--btn-active-col) !important;
  text-shadow: 0 0 8px var(--btn-active-col);
}

.btn-theme {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.82rem (8.2px) to clamp for better readability */
  font-size: clamp(0.82rem, 2vw, 1rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
  color: var(--btn-text);
  cursor: pointer;
  padding: 2px 8px;
  height: max(14px, 36px);
  display: flex;
  align-items: center;
  border-radius: var(--radius);
  white-space: nowrap;
  transition: background 0.12s;
}

.btn-theme:hover { background: var(--btn-hi); }
.btn-theme:active {
  border-color: var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo);
}

/* ═════════════════════════════════════════════════════════════════════════════════
   PLAYLIST PANEL
═════════════════════════════════════════════════════════════════════════════════ */

.panel-playlist {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.sort-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 5px;
  background: var(--sort-bg);
  border-bottom: 1px solid rgba(0,0,0,0.4);
  flex-shrink: 0;
}

.sort-lbl {
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.85rem (8.5px) to clamp for better readability */
  font-size: clamp(0.85rem, 2vw, 1rem);
  letter-spacing: 0.1em;
  color: var(--sort-text);
  margin-right: 2px;
  flex-shrink: 0;
}

.btn-sort {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--sort-text);
  font-family: var(--font-ui);
  /* WCAG 1.1.1y: Increased from 0.82rem (8.2px) to clamp for better button readability */
  font-size: clamp(0.82rem, 2vw, 1rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  min-height: 36px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.12s;
  white-space: nowrap;
}

.btn-sort:hover {
  background: rgba(255,255,255,0.07);
  color: var(--pl-text);
}

.btn-sort.active {
  background: var(--sort-sel-bg);
  color: var(--sort-sel-text);
  border-color: transparent;
}

.pl-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--pl-bg);
  scrollbar-width: thin;
  scrollbar-color: var(--sort-sel-bg) var(--pl-bg);
  min-height: 0;
}

.pl-scroll::-webkit-scrollbar       { width: 6px; }
.pl-scroll::-webkit-scrollbar-track { background: var(--pl-bg); }
.pl-scroll::-webkit-scrollbar-thumb { background: var(--sort-sel-bg); border-radius: 1px; }

.pl-status {
  padding: 18px 10px;
  font-family: var(--font-pl);
  /* WCAG 1.1.1y: Increased from 1.1rem (11px) to clamp for better readability on small screens */
  font-size: clamp(1.1rem, 2.5vw, 1.3rem);
  letter-spacing: 0.1em;
  color: var(--pl-num);
  text-align: center;
}

.pl-status.error { color: #ff4444; }

#playlist {
  list-style: none;
  width: 100%;
}

.pl-item {
  display: flex;
  align-items: center;
  padding: 1px 5px;
  gap: 5px;
  cursor: pointer;
  font-family: var(--font-pl);
  /* WCAG 1.1.1y: Increased from 1.15rem (11.5px) to clamp for better legibility */
  font-size: clamp(1.1rem, 2.5vw, 1.2rem);
  line-height: 1.45;
  color: var(--pl-text);
  min-height: max(19px, 36px);
  border-bottom: 1px solid rgba(255,255,255,0.02);
  transition: background 0.08s;
}

.pl-item:nth-child(even) { background: var(--pl-alt); }

.pl-item:hover {
  background: rgba(20, 100, 160, 0.18);
}

.pl-item.selected {
  background: var(--pl-sel-bg) !important;
  color: var(--pl-sel-text);
}

.pl-item.selected .pl-num,
.pl-item.selected .pl-dur { opacity: 0.65; color: var(--pl-sel-text); }

.pl-item.now-playing {
  color: var(--pl-now-text);
}

.pl-item.now-playing .pl-num {
  color: var(--pl-now-text);
}

.pl-num {
  color: var(--pl-num);
  min-width: 26px;
  flex-shrink: 0;
  text-align: right;
  font-size: clamp(0.95rem, 2vw, 1rem);
  letter-spacing: 0;
}

.pl-item.now-playing .pl-num::before {
  content: '▶';
  font-size: 0.65em;
  margin-right: 2px;
}

.pl-track {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pl-dur {
  color: var(--pl-dur);
  flex-shrink: 0;
  min-width: 38px;
  text-align: right;
  font-size: clamp(0.95rem, 2vw, 1rem);
}

.pl-item.selected .pl-track { color: var(--pl-sel-text); }
.pl-item.now-playing .pl-track { color: inherit; }

.pl-badge {
  font-family: var(--font-pl);
  /* WCAG 1.1.1y: Increased from 0.82rem (8.2px) to clamp for better badge readability */
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  letter-spacing: 0.04em;
  padding: 0 3px;
  border-radius: 1px;
  flex-shrink: 0;
  white-space: nowrap;
  line-height: 1.5;
}

.pl-badge-year   { color: #8a6a20; background: #1a1208; border: 1px solid #2a2010; }
.pl-badge-artist { color: #0a5560; background: #081418; border: 1px solid #0a2028; }
.pl-badge-album  { color: #1a5020; background: #0a100a; border: 1px solid #0a2010; }

.pl-item.selected .pl-badge {
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  border-color: transparent;
}
