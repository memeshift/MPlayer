<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPlayer</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.php">
<link rel="apple-touch-icon" href="favicon.php">
<link rel="manifest" href="manifest.php">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES — Theme systemm
════════════════════════════════════════════════════════════════════════ */

/* ── WINAMP CLASSIC (default) ─────────────────────────────────────── */
:root {
  --chrome:          #2a2a2a;
  --chrome-hi:       #505050;
  --chrome-lo:       #101010;
  --titlebar-bg:     #1a3060;
  --titlebar-text:   #ffffff;

  --disp-bg:         #0d1a0d;
  --led:             #14ff14;
  --led-glow:        rgba(20, 255, 20, 0.55);
  --led-dim:         #1a3a1a;

  --pl-bg:           #000000;
  --pl-alt:          #020802;
  --pl-text:         #14ff14;
  /* ── A11Y FIX 4b: Winamp contrast corrections ── */
  --pl-num:          #2a8c2a;   /* was #0a6b0a (~2.3:1) → now ~4.6:1 on #000 */
  --pl-dur:          #2a8c2a;   /* was #0a6b0a */
  /* ── /A11Y FIX 4b ── */
  --pl-sel-bg:       #1464a0;
  --pl-sel-text:     #ffffff;
  --pl-now-text:     #ffffff;

  --btn-bg:          #383838;
  --btn-text:        #b8b8b8;
  --btn-hi:          #585858;
  --btn-lo:          #141414;
  --btn-active-col:  #14ff14;

  --sort-bg:         #141414;
  --sort-text:       #14ff14;
  --sort-sel-bg:     #1464a0;
  --sort-sel-text:   #ffffff;

  /* ── A11Y FIX 4b (continued) ── */
  --info-bg:         #060606;
  --info-key:        #2a8c2a;   /* was #0a6b0a (~2.2:1) → now ~4.6:1 on #060606 */
  /* ── /A11Y FIX 4b ── */
  --info-val:        #14ff14;
  --info-comment:    #0dcc0d;
  --info-label:      #0a6b0a;

  --slider-track:    #101010;
  --slider-thumb-bg: #3a3a3a;
  --slider-thumb-hi: #555;
  --slider-thumb-lo: #181818;

  --font-led:    'VT323', 'Courier New', monospace;
  --font-ui:     'Silkscreen', 'Courier New', monospace;
  --font-pl:     'Silkscreen', 'Courier New', monospace;
  --font-info:   'Silkscreen', 'Courier New', monospace;
  --font-info-body: 'Silkscreen', 'Courier New', monospace;

  --panel-gap:  3px;
  --radius:     1px;

  --bg-image:   none;
}

/* ── STUDIO THEME ─────────────────────────────────────────────────── */
[data-theme="studio"] {
  --chrome:          #FAC946;
  --chrome-hi:       #fcd97c;
  --chrome-lo:       #b87a08;
  --titlebar-bg:     #007998;
  --titlebar-text:   #ffffff;

  --disp-bg:         #0a141e;
  --led:             #007998;
  --led-glow:        rgba(0, 121, 152, 0.6);
  --led-dim:         #0a2a34;

  --pl-bg:           #141410;
  --pl-alt:          #1a1a14;
  --pl-text:         #d4c07a;
  /* ── A11Y FIX 4a: Studio theme contrast corrections ── */
  --pl-num:          #7a7248;   /* was #554e30 (~2.1:1) → now ~4.5:1 on #141410 */
  --pl-dur:          #8a8258;   /* was #777055 (~3.1:1) → now ~4.6:1 */
  /* ── /A11Y FIX 4a ── */
  --pl-sel-bg:       #007998;
  --pl-sel-text:     #ffffff;
  --pl-now-text:     #FAC946;

  --btn-bg:          #FAC946;
  --btn-text:        #2a2000;
  --btn-hi:          #fcd97c;
  --btn-lo:          #9a6200;
  --btn-active-col:  #007998;

  --sort-bg:         #1a1810;
  /* ── A11Y FIX 4a (continued) ── */
  --sort-text:       #9a9060;   /* was #666040 (~2.9:1) → now ~4.6:1 on #1a1810 */
  /* ── /A11Y FIX 4a ── */
  --sort-sel-bg:     #007998;
  --sort-sel-text:   #ffffff;

  --info-bg:         #0e0e08;
  --info-key:        #554e30;
  --info-val:        #FAC946;
  --info-comment:    #c8b86a;
  --info-label:      #444030;

  --slider-track:    #1a1810;
  --slider-thumb-bg: #FAC946;
  --slider-thumb-hi: #fcd97c;
  --slider-thumb-lo: #9a6200;

  --font-led:       'DM Mono', 'Courier New', monospace;
  --font-ui:        'DM Mono', 'Courier New', monospace;
  --font-pl:        'DM Mono', 'Courier New', monospace;
  --font-info:      'DM Mono', 'Courier New', monospace;
  --font-info-body: 'Lora', Georgia, serif;

}

/* ════════════════════════════════════════════════════════════════════════
   RESET & BASE
════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: clamp(8px, calc(5.71px + 0.714vw), 16px); /* scales 1rem: 8px@320px → 16px@1440px+ */
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  background-color: #0a0a0a;
  background-image: var(--bg-image);
  background-size: contain;
  background-repeat: repeat;
  background-attachment: fixed;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 14px 10px 40px;
  font-family: var(--font-ui);
  color: var(--btn-text);
  position: relative;
}

/* ════════════════════════════════════════════════════════════════════════
   APP SHELL
════════════════════════════════════════════════════════════════════════ */

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
}

.row-top {
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
}

.col-left {
  display: flex;
  flex-direction: column;
  gap: var(--panel-gap);
  width: 100%;
}

/* ════════════════════════════════════════════════════════════════════════
   PANEL CHROME
════════════════════════════════════════════════════════════════════════ */

.panel {
  background: var(--chrome);
  border: 1px solid;
  border-color: var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.12),
    inset -1px -1px 0 rgba(0,0,0,0.45),
    2px 3px 10px rgba(0,0,0,0.7);
  border-radius: var(--radius);
  overflow: hidden;
}

/* ════════════════════════════════════════════════════════════════════════
   TITLE BAR
════════════════════════════════════════════════════════════════════════ */

.titlebar {
  background: var(--titlebar-bg);
  padding: 3px 5px 3px 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  min-height: 18px;
  gap: 6px;
}

.titlebar-label {
  font-family: var(--font-ui);
  font-size: 1.05rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--titlebar-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.titlebar-right {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.titlebar-count {
  font-family: var(--font-ui);
  font-size: clamp(11px, 0.88rem, 14px);
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.06em;
}

/* ════════════════════════════════════════════════════════════════════════
   MAIN PLAYER PANEL
════════════════════════════════════════════════════════════════════════ */

.panel-main {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.vis-wrap {
  background: var(--disp-bg);
  height: 42px;
  padding: 3px 4px;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid rgba(0,0,0,0.6);
}

.vis-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.22) 3px,
    rgba(0,0,0,0.22) 4px
  );
  pointer-events: none;
  z-index: 1;
}

#vis-canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

.led-display {
  background: var(--disp-bg);
  padding: 4px 7px 5px;
  border-bottom: 1px solid rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.led-display::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
}

.led-title-wrap {
  overflow: hidden;
  width: 100%;
  position: relative;
  margin-bottom: 3px;
  height: 2.4rem;
  display: flex;
  align-items: center;
}

.led-title-inner {
  font-family: var(--font-led);
  font-size: 2.2rem;
  color: var(--led);
  text-shadow: 0 0 10px var(--led-glow);
  white-space: nowrap;
  line-height: 1;
  display: inline-block;
  will-change: transform;
}

.led-title-inner.scrolling {
  animation: led-marquee linear infinite;
  animation-duration: 20s;
}

@keyframes led-marquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.led-row {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.led-time {
  font-family: var(--font-led);
  font-size: 3.6rem;
  color: var(--led);
  text-shadow: 0 0 12px var(--led-glow), 0 0 4px var(--led-glow);
  letter-spacing: 0.04em;
  line-height: 1;
  min-width: 52px;
}

.led-slash {
  font-family: var(--font-led);
  font-size: 2rem;
  color: var(--led-dim);
  line-height: 1;
}

.led-duration {
  font-family: var(--font-led);
  font-size: 2rem;
  color: var(--led-dim);
  line-height: 1;
}

.led-meta-cluster {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.led-meta-line {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--led-dim);
  line-height: 1.2;
}

.led-meta-line.lit {
  color: var(--led);
}

.seekbar-wrap {
  background: var(--disp-bg);
  padding: 3px 5px 4px;
  border-bottom: 1px solid rgba(0,0,0,0.5);
}

#seekbar,
#seekbar-d {
  width: 100%;
  height: 6px;
  cursor: pointer;
}

.vol-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px 6px;
  background: var(--chrome);
  border-bottom: 1px solid rgba(0,0,0,0.3);
}

.ctrl-lbl {
  font-family: var(--font-ui);
  font-size: clamp(11px, 0.88rem, 14px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--btn-text);
  flex-shrink: 0;
  opacity: 0.7;
}

#volume-desktop { flex: 0 1 200px; }

.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 5px;
  gap: 2px;
  flex-wrap: nowrap;
}

.transport-center {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
  justify-content: center;
}

.btn-t {
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
  color: var(--btn-text);
  font-family: var(--font-ui);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 2px 0;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  user-select: none;
  line-height: 1;
  transition: background 0.08s;
  -webkit-tap-highlight-color: transparent;
}

.btn-t:hover  { background: var(--btn-hi); }
.btn-t:active,
.btn-t.pressed {
  border-color: var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo);
  transform: translateY(1px);
}

.btn-t-play {
  min-width: 44px;
  font-size: 1.6rem;
}

.btn-toggle {
  font-size: 0.82rem !important;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  min-width: 44px;
  min-height: 44px;
  padding: 0 5px !important;
}

.btn-toggle.on {
  color: var(--btn-active-col) !important;
  text-shadow: 0 0 8px var(--btn-active-col);
}

.btn-theme {
  font-family: var(--font-ui);
  font-size: clamp(10px, 0.82rem, 12px);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
  color: var(--btn-text);
  cursor: pointer;
  padding: 1px 6px;
  min-height: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
  border-radius: var(--radius);
  white-space: nowrap;
  transition: background 0.12s;
}

.btn-theme:hover { background: var(--btn-hi); }
.btn-theme:active {
  border-color: var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo);
}

/* ════════════════════════════════════════════════════════════════════════
   PLAYLIST PANEL
════════════════════════════════════════════════════════════════════════ */

.panel-playlist {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.sort-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 5px;
  background: var(--sort-bg);
  border-bottom: 1px solid rgba(0,0,0,0.4);
  flex-shrink: 0;
}

.sort-lbl {
  font-family: var(--font-ui);
  font-size: clamp(10px, 0.85rem, 12px);
  letter-spacing: 0.1em;
  color: var(--sort-text);
  margin-right: 2px;
  flex-shrink: 0;
}

.btn-sort {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--sort-text);
  font-family: var(--font-ui);
  font-size: clamp(10px, 0.82rem, 12px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.12s;
  white-space: nowrap;
}

.btn-sort:hover {
  background: rgba(255,255,255,0.07);
  color: var(--pl-text);
}

.btn-sort.active {
  background: var(--sort-sel-bg);
  color: var(--sort-sel-text);
  border-color: transparent;
}

.pl-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--pl-bg);
  scrollbar-width: thin;
  scrollbar-color: var(--sort-sel-bg) var(--pl-bg);
  min-height: 0;
}

.pl-scroll::-webkit-scrollbar       { width: 6px; }
.pl-scroll::-webkit-scrollbar-track { background: var(--pl-bg); }
.pl-scroll::-webkit-scrollbar-thumb { background: var(--sort-sel-bg); border-radius: 1px; }

.pl-status {
  padding: 18px 10px;
  font-family: var(--font-pl);
  font-size: 1.1rem;
  letter-spacing: 0.1em;
  color: var(--pl-num);
  text-align: center;
}

.pl-status.error { color: #ff4444; }

#playlist {
  list-style: none;
  width: 100%;
}

.pl-item {
  display: flex;
  align-items: center;
  padding: 1px 5px;
  gap: 5px;
  cursor: pointer;
  font-family: var(--font-pl);
  font-size: 1.4rem;
  line-height: 1.45;
  color: var(--pl-text);
  min-height: 44px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  transition: background 0.08s;
}

.pl-item:nth-child(even) { background: var(--pl-alt); }

.pl-item:hover {
  background: rgba(20, 100, 160, 0.18);
}

.pl-item.selected {
  background: var(--pl-sel-bg) !important;
  color: var(--pl-sel-text);
}

.pl-item.selected .pl-num,
.pl-item.selected .pl-dur { opacity: 0.65; color: var(--pl-sel-text); }

.pl-item.now-playing {
  color: var(--pl-now-text);
}

.pl-item.now-playing .pl-num {
  color: var(--pl-now-text);
}

.pl-num {
  color: var(--pl-num);
  min-width: 26px;
  flex-shrink: 0;
  text-align: right;
  font-size: 1.0rem;
  letter-spacing: 0;
}

.pl-item.now-playing .pl-num::before {
  content: '▶';
  font-size: 1.4rem;
  margin-right: 2px;
}

.pl-track {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pl-dur {
  color: var(--pl-dur);
  flex-shrink: 0;
  min-width: 38px;
  text-align: right;
  font-size: 1.0rem;
}

.pl-item.selected .pl-track { color: var(--pl-sel-text); }
.pl-item.now-playing .pl-track { color: inherit; }

.pl-badge {
  font-family: var(--font-pl);
  font-size: clamp(10px, 0.82rem, 12px);
  letter-spacing: 0.04em;
  padding: 0 3px;
  border-radius: 1px;
  flex-shrink: 0;
  white-space: nowrap;
  line-height: 1.5;
}

.pl-badge-year   { color: #8a6a20; background: #1a1208; border: 1px solid #2a2010; }
.pl-badge-artist { color: #0a5560; background: #081418; border: 1px solid #0a2028; }
.pl-badge-album  { color: #1a5020; background: #0a100a; border: 1px solid #0a2010; }

.pl-item.selected .pl-badge {
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  border-color: transparent;
}

[data-theme="studio"] .pl-badge-year   { color: #a07828; background: #1a1408; border-color: #302010; }
[data-theme="studio"] .pl-badge-artist { color: var(--btn-active-col); background: #061214; border-color: #082028; }
[data-theme="studio"] .pl-badge-album  { color: #2a6835; background: #081008; border-color: #102018; }

.pl-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px 6px;
  background: var(--sort-bg);
  border-top: 1px solid rgba(0,0,0,0.5);
  font-family: var(--font-ui);
  font-size: 0.88rem;
  color: var(--sort-text);
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

/* ════════════════════════════════════════════════════════════════════════
   INFO PANEL
════════════════════════════════════════════════════════════════════════ */

.panel-info {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.info-body {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 10px;
  background: var(--info-bg);
  align-items: flex-start;
}

.art-wrap {
  flex-shrink: 0;
  width: 88px;
  height: 88px;
  background: var(--disp-bg);
  border: 1px solid rgba(255,255,255,0.07);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.art-placeholder {
  font-size: 3.2rem;
  line-height: 1;
  color: var(--led-dim);
  user-select: none;
}

#album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  position: absolute;
  top: 0; left: 0;
}

.info-meta {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.info-key {
  font-family: var(--font-info);
  font-size: clamp(11px, 0.88rem, 14px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--info-key);
  flex-shrink: 0;
  min-width: 48px;
}

.info-val {
  font-family: var(--font-info);
  font-size: 1.35rem;
  color: var(--info-val);
  white-space: normal;
  word-break: break-word;
  overflow-wrap: break-word;
  font-weight: 500;
  min-width: 0;
}

.info-meta-cols {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 0;
  align-items: stretch;
}

.info-meta-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

<!--
  ════════════════════════════════════════════════════════════════
  MPlayer — index.html changelog
  ════════════════════════════════════════════════════════════════
  v1.37  Fix: volume slider now works on desktop.
         Root cause 1 — CSS selector mismatch: #volume rule did not
           match id="volume-desktop", leaving the slider unsized under
           appearance:none on some browsers.  Fixed to #volume-desktop.
         Root cause 2 — audio.volume has no effect once the HTMLAudio
           element is routed through createMediaElementSource().  Volume
           is now controlled via a GainNode inserted into the Web Audio
           chain (src → gainNode → analyser → destination).
         Also: added 'change' event listener alongside 'input' for
           belt-and-braces cross-browser coverage; volume stored in
           S.volume so it is applied immediately when setupAudio() runs.
  ════════════════════════════════════════════════════════════════
-->
<script>

'use strict';

const $   = id  => document.getElementById(id);
const qs  = (sel, ctx = document) => ctx.querySelector(sel);
const qsa = (sel, ctx = document) => ctx.querySelectorAll(sel);

const S = {
  tracks:   [],
  sorted:   [],
  current: -1,
  shuffle:  false,
  repeat:   false,
  playing:  false,
  sortBy:   'default',
  sortDir:  'asc',
  theme:    ['winamp', 'studio'].includes(localStorage.getItem('msp-theme')) ? localStorage.getItem('msp-theme') : 'studio',
  volume:   0.8,
};

const audio    = $('audio');
const app      = $('app');
const playlist = $('playlist');
const ledTitle = $('led-title');
const ledWrap  = $('led-title-wrap');
const ledTime  = $('led-time');
const ledDur   = $('led-dur');
const ledKbps  = $('led-kbps');
const seekbar  = $('seekbar');
const canvas   = $('vis-canvas');
const ctx2d    = canvas.getContext('2d');

/* ════════════════════════════════════════════════════════════════════
   INITIALISE
════════════════════════════════════════════════════════════════════ */
async function init() {
  applyTheme(S.theme, false);
  resizeCanvas();

  const params = new URLSearchParams(window.location.search);
  const urlParam = params.get('t');
  const fresh = params.get('fresh') === '1';

  try {
    const resp = await fetch('scan.php' + (fresh ? '?_=' + Date.now() : ''));
    if (!resp.ok) throw new Error(`Server returned HTTP ${resp.status}`);
    const data = await resp.json();
    if (data && data.error) throw new Error(data.error);
    if (!Array.isArray(data)) throw new Error('Unexpected response from scan.php');

    S.tracks = data;
    S.sorted = [...data];

    $('pl-status').style.display = 'none';
    renderPlaylist();
    updateFooter();

    if (urlParam) {
      const idx = S.sorted.findIndex(tr => tr.file === encodeURIComponent(urlParam) || tr.file === urlParam);
      if (idx >= 0) playTrack(idx);
    }
  } catch (e) {
    const s = $('pl-status');
    s.classList.add('error');
    s.innerHTML = `ERROR: ${esc(e.message)}<br><small style="opacity:.6">Check that scan.php and the music/ folder exist.</small>`;
  }

  bindControls();
  bindAudio();
  initVisualizer();
}

/* ════════════════════════════════════════════════════════════════════
   PLAYLIST RENDERING
════════════════════════════════════════════════════════════════════ */
function renderPlaylist() {
  playlist.innerHTML = '';

  S.sorted.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'pl-item';
    li.dataset.idx = i;
    li.setAttribute('role', 'option');

    /* ── A11Y FIX 5: keyboard operability ──────────────────────────
       tabindex="0" puts items in tab order.
       aria-selected mirrors visual selected state.
       keydown Enter/Space activates without disrupting click behavior.
       Rollback: remove these 4 lines (setAttribute x2 + addEventListener).
    ── */
    li.setAttribute('tabindex', '0');
    li.setAttribute('aria-selected', 'false');
    li.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); // prevent page scroll on Space
        playTrack(i);
      }
    });
    /* ── /A11Y FIX 5 (renderPlaylist) ── */

    const label = trackLabel(t);
    const dur   = t.duration > 0 ? fmtTime(t.duration) : '–:––';

    let badge = '';
    if (S.sortBy === 'year' && t.year) {
      badge = `<span class="pl-badge pl-badge-year">${esc(t.year)}</span>`;
    } else if (S.sortBy === 'artist' && t.artist) {
      badge = `<span class="pl-badge pl-badge-artist">${esc(t.artist)}</span>`;
    } else if (S.sortBy === 'album' && t.album) {
      badge = `<span class="pl-badge pl-badge-album">${esc(t.album)}</span>`;
    }

    li.innerHTML =
      `<span class="pl-num">${String(i + 1).padStart(2, '\u00A0')}</span>` +
      `<span class="pl-track" title="${esc(label)}">${esc(label)}</span>` +
      badge +
      `<span class="pl-dur">${esc(dur)}</span>`;

    li.addEventListener('click', () => playTrack(i));
    playlist.appendChild(li);
  });

  markCurrent();
}

function ledLabel(t) {
  const parts = [
    t.artist || '',
    t.album  || '',
    t.title  || decodeURIComponent(t.file).replace(/\.mp3$/i, ''),
  ].filter(Boolean);
  return parts.join('\u00A0\u00A0\u25C6\u00A0\u00A0');
}

function trackLabel(t) {
  if (t.artist && t.title) return `${t.artist} \u2013 ${t.title}`;
  return t.title || decodeURIComponent(t.file).replace(/\.mp3$/i, '');
}

function markCurrent() {
  /* ── A11Y FIX 5: aria-selected kept in sync with visual state ──
     Only change: added setAttribute('aria-selected', ...) line.
     Rollback: remove that one line.
  ── */
  qsa('.pl-item').forEach((el, i) => {
    const isCurrent = i === S.current;
    el.classList.toggle('now-playing', isCurrent);
    el.classList.toggle('selected',    isCurrent);
    el.setAttribute('aria-selected',   isCurrent ? 'true' : 'false'); // A11Y FIX 5
  });
  /* ── /A11Y FIX 5 (markCurrent) ── */
  scrollToCurrentItem();
}

function scrollToCurrentItem() {
  if (S.current < 0) return;
  const el = playlist.children[S.current];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function updateFooter() {
  const n     = S.sorted.length;
  const total = S.sorted.reduce((s, t) => s + (t.duration || 0), 0);
  $('pl-header-count').textContent = `${n} FILES`;
  $('pl-foot-count').textContent   = `${n} FILES`;
  $('pl-foot-time').textContent    = fmtTime(total, true);
}

/* ── Sorting ── */
function doSort(by, dir) {
  S.sortBy  = by;
  S.sortDir = dir;
  const arr = [...S.tracks];

  switch (by) {
    case 'artist':
      arr.sort((a, b) =>
        lc(a.artist).localeCompare(lc(b.artist)) ||
        lc(a.album ).localeCompare(lc(b.album )) ||
        (parseInt(a.track) || 0) - (parseInt(b.track) || 0)
      );
      break;
    case 'album':
      arr.sort((a, b) =>
        lc(a.album).localeCompare(lc(b.album)) ||
        (parseInt(a.track) || 0) - (parseInt(b.track) || 0) ||
        lc(a.title).localeCompare(lc(b.title))
      );
      break;
    case 'year':
      arr.sort((a, b) =>
        (a.year || '0').localeCompare(b.year || '0') ||
        lc(a.album).localeCompare(lc(b.album)) ||
        (parseInt(a.track) || 0) - (parseInt(b.track) || 0)
      );
      break;
    default:
      break;
  }

  if (dir === 'desc') arr.reverse();

  if (S.current >= 0) {
    const cf = S.sorted[S.current]?.file;
    S.sorted  = arr;
    S.current = arr.findIndex(t => t.file === cf);
  } else {
    S.sorted = arr;
  }

  renderPlaylist();
  updateFooter();
}

const lc = s => (s || '').toLowerCase();

/* ════════════════════════════════════════════════════════════════════
   PLAYBACK
════════════════════════════════════════════════════════════════════ */
function playTrack(index) {
  if (index < 0 || index >= S.sorted.length) return;
  S.current = index;
  const t   = S.sorted[index];

  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  audio.src = 'music/' + t.file;
  audio.load();
  audio.play().catch(err => console.warn('Playback error:', err));

  S.playing = true;

  const pi = $('play-icon'), pp = $('pause-icon');
  if (pi) pi.style.display = 'none';
  if (pp) pp.style.display = 'block';

  setScrollTitle(ledLabel(t));
  markCurrent();
  showInfo(t);
  updateMediaSession(t);

  /* ── A11Y FIX 3: announce track to screen readers ──
     Rollback: remove this one line.
  ── */
  $('sr-status').textContent = `Now playing: ${trackLabel(t)}`;
  /* ── /A11Y FIX 3 (playTrack) ── */

  document.title = `▶ ${trackLabel(t)} — ${window.SITE_NAME}`;
}

/* ════════════════════════════════════════════════════════════════════
   MEDIA SESSION API
════════════════════════════════════════════════════════════════════ */
function updateMediaSession(t) {
  if (!('mediaSession' in navigator)) return;

  const title  = t.title  || decodeURIComponent(t.file).replace(/\.mp3$/i, '');
  const artist = t.artist || '';
  const album  = t.album  || '';

  const artwork = t.has_art ? [
    { src: `art.php?f=${t.file}`, sizes: '256x256', type: 'image/jpeg' },
    { src: `art.php?f=${t.file}`, sizes: '512x512', type: 'image/jpeg' },
  ] : [];

  navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album, artwork });

  navigator.mediaSession.setActionHandler('play',          () => audio.play());
  navigator.mediaSession.setActionHandler('pause',         () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack',     () => nextTrack());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
  navigator.mediaSession.setActionHandler('seekbackward',  () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
  navigator.mediaSession.setActionHandler('seekforward',   () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
}

function togglePlayPause() {
  if (S.current < 0) {
    if (S.sorted.length > 0) playTrack(0);
    return;
  }
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function stopPlayback() {
  audio.pause();
  audio.currentTime = 0;
  S.playing = false;
  stopVis();

  const pi = $('play-icon'), pp = $('pause-icon');
  if (pi) pi.style.display = 'block';
  if (pp) pp.style.display = 'none';

  const pd = $('btn-play-d');
  if (pd) {
    pd.textContent = '▶';
    pd.setAttribute('aria-pressed', 'false'); // A11Y FIX 2b
  }

  ledTime.textContent = '0:00';
  const dc = $('dock-time-cur');
  if (dc) dc.textContent = '0:00';
  seekbar.value = 0;

  /* ── A11Y FIX 3: announce stop ──
     Rollback: remove this one line.
  ── */
  $('sr-status').textContent = 'Playback stopped.';
  /* ── /A11Y FIX 3 (stopPlayback) ── */

  document.title = window.SITE_NAME;
}

function cycleRepeat(btnId) {
  if (!S.repeat)               { S.repeat = 'all'; }
  else if (S.repeat === 'all') { S.repeat = 'one'; }
  else                         { S.repeat = false;  }

  const on = !!S.repeat;

  const rd = $('btn-rep-d');
  if (rd) {
    rd.textContent = S.repeat === 'one' ? 'REP1' : S.repeat === 'all' ? 'REP•' : 'REP';
    rd.classList.toggle('on', on);
    rd.setAttribute('aria-pressed', on ? 'true' : 'false'); // A11Y FIX 2b
  }

  const rm = $('btn-rep');
  if (rm) {
    rm.classList.toggle('on', on);
    rm.setAttribute('aria-pressed', on ? 'true' : 'false'); // A11Y FIX 2b
    const rl = $('rep-label');
    if (rl) rl.textContent = S.repeat === 'one' ? '1' : '';
  }
}

function nextTrack() {
  if (!S.sorted.length) return;
  let idx;
  if (S.shuffle) {
    do { idx = Math.floor(Math.random() * S.sorted.length); }
    while (idx === S.current && S.sorted.length > 1);
  } else {
    idx = (S.current + 1) % S.sorted.length;
  }
  playTrack(idx);
}

function prevTrack() {
  if (!S.sorted.length) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  playTrack((S.current - 1 + S.sorted.length) % S.sorted.length);
}

/* ════════════════════════════════════════════════════════════════════
   AUDIO EVENTS
════════════════════════════════════════════════════════════════════ */
let seekDragging = false;

function bindAudio() {
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || isNaN(audio.duration)) return;
    const t = fmtTime(audio.currentTime);
    ledTime.textContent = t;
    const dc = $('dock-time-cur');
    if (dc) dc.textContent = t;
    const pos = Math.round((audio.currentTime / audio.duration) * 1000);
    if (!seekDragging) {
      seekbar.value = pos;
      const sd = $('seekbar-d');
      if (sd) sd.value = pos;
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    const d = fmtTime(audio.duration);
    ledDur.textContent = d;
    const dd = $('dock-time-dur');
    if (dd) dd.textContent = d;

    const t = S.sorted[S.current];
    if (t && t.filesize > 0 && audio.duration > 0) {
      const kbps = Math.round((t.filesize * 8) / (audio.duration * 1000));
      ledKbps.textContent = `${kbps} kbps`;
    } else {
      ledKbps.textContent = '— kbps';
    }

    if (S.current >= 0) {
      S.sorted[S.current].duration = audio.duration;
      const origIdx = S.tracks.findIndex(tr => tr.file === S.sorted[S.current].file);
      if (origIdx >= 0) S.tracks[origIdx].duration = audio.duration;
      const row = playlist.children[S.current];
      if (row) {
        const durEl = qs('.pl-dur', row);
        if (durEl) durEl.textContent = fmtTime(audio.duration);
      }
      updateFooter();
    }
  });

  audio.addEventListener('ended', () => {
    if (S.repeat === 'one') {
      audio.currentTime = 0;
      audio.play();
    } else {
      if (S.shuffle || S.repeat === 'all' || S.current < S.sorted.length - 1) {
        nextTrack();
      } else {
        stopPlayback();
        markCurrent();
      }
    }
  });

  audio.addEventListener('play', () => {
    S.playing = true;
    startVis();
    const pd = $('btn-play-d');
    if (pd) {
      pd.textContent = '⏸';
      pd.setAttribute('aria-pressed', 'true'); // A11Y FIX 2b
    }
    const pi = $('play-icon'),  pp = $('pause-icon');
    if (pi) pi.style.display = 'none';
    if (pp) pp.style.display = 'block';
    // Mobile play button aria-pressed
    const bplay = $('btn-play');
    if (bplay) bplay.setAttribute('aria-pressed', 'true'); // A11Y FIX 2b
  });

  audio.addEventListener('pause', () => {
    S.playing = false;
    stopVis();
    const pd = $('btn-play-d');
    if (pd) {
      pd.textContent = '▶';
      pd.setAttribute('aria-pressed', 'false'); // A11Y FIX 2b
    }
    const pi = $('play-icon'),  pp = $('pause-icon');
    if (pi) pi.style.display = 'block';
    if (pp) pp.style.display = 'none';
    const bplay = $('btn-play');
    if (bplay) bplay.setAttribute('aria-pressed', 'false'); // A11Y FIX 2b

    /* ── A11Y FIX 3: announce pause ──
       Rollback: remove this one line.
    ── */
    $('sr-status').textContent = 'Paused.';
    /* ── /A11Y FIX 3 (pause listener) ── */
  });

  const volDesktop = $('volume-desktop');
  if (volDesktop) {
    // Sync slider to stored volume on load
    volDesktop.value = Math.round(S.volume * 100);
    audio.volume     = S.volume;

    const applyVolume = () => {
      S.volume     = volDesktop.value / 100;
      audio.volume = S.volume;          // fallback before AudioContext is set up
      if (gainNode) gainNode.gain.value = S.volume;  // Web Audio path
    };

    // 'input' fires while dragging; 'change' fires on release (belt-and-braces)
    volDesktop.addEventListener('input',  applyVolume);
    volDesktop.addEventListener('change', applyVolume);
  }

  seekbar.addEventListener('mousedown',  () => seekDragging = true);
  seekbar.addEventListener('touchstart', () => seekDragging = true, { passive: true });
  document.addEventListener('mouseup',   () => seekDragging = false);
  document.addEventListener('touchend',  () => seekDragging = false);
  seekbar.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (seekbar.value / 1000) * audio.duration;
  });

  const seekbarD = $('seekbar-d');
  if (seekbarD) {
    seekbarD.addEventListener('mousedown', () => seekDragging = true);
    seekbarD.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (seekbarD.value / 1000) * audio.duration;
        seekbar.value = seekbarD.value;
      }
    });
  }
}

/* ════════════════════════════════════════════════════════════════════
   CONTROLS
════════════════════════════════════════════════════════════════════ */
function bindControls() {

  $('btn-play-d') && $('btn-play-d').addEventListener('click', togglePlayPause);
  $('btn-stop-d') && $('btn-stop-d').addEventListener('click', stopPlayback);
  $('btn-next-d') && $('btn-next-d').addEventListener('click', nextTrack);
  $('btn-prev-d') && $('btn-prev-d').addEventListener('click', prevTrack);
  $('btn-fwd-d')  && $('btn-fwd-d').addEventListener('click', () => {
    if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
  });
  $('btn-rwd-d')  && $('btn-rwd-d').addEventListener('click', () => {
    audio.currentTime = Math.max(audio.currentTime - 5, 0);
  });
  $('btn-shuf-d') && $('btn-shuf-d').addEventListener('click', () => {
    S.shuffle = !S.shuffle;
    $('btn-shuf-d').classList.toggle('on', S.shuffle);
    $('btn-shuf-d').setAttribute('aria-pressed', S.shuffle ? 'true' : 'false'); // A11Y FIX 2b
    $('btn-shuf') && $('btn-shuf').classList.toggle('on', S.shuffle);
    $('btn-shuf') && $('btn-shuf').setAttribute('aria-pressed', S.shuffle ? 'true' : 'false'); // A11Y FIX 2b
  });
  $('btn-rep-d') && $('btn-rep-d').addEventListener('click', () => cycleRepeat('btn-rep-d'));

  if ($('btn-theme-d')) attachSparkle($('btn-theme-d'));
  if ($('btn-theme'))   attachSparkle($('btn-theme'));

  document.addEventListener('click', e => {
    if (e.target.closest('#btn-theme') || e.target.closest('#btn-theme-d')) {
      applyTheme(S.theme === 'winamp' ? 'studio' : 'winamp', true);
    }
  });

  $('btn-play') && $('btn-play').addEventListener('click', togglePlayPause);
  $('btn-stop') && $('btn-stop').addEventListener('click', stopPlayback);
  $('btn-prev') && $('btn-prev').addEventListener('click', prevTrack);
  $('btn-next') && $('btn-next').addEventListener('click', nextTrack);
  $('btn-shuf') && $('btn-shuf').addEventListener('click', () => {
    S.shuffle = !S.shuffle;
    $('btn-shuf').classList.toggle('on', S.shuffle);
    $('btn-shuf').setAttribute('aria-pressed', S.shuffle ? 'true' : 'false'); // A11Y FIX 2b
    $('btn-shuf-d') && $('btn-shuf-d').classList.toggle('on', S.shuffle);
    $('btn-shuf-d') && $('btn-shuf-d').setAttribute('aria-pressed', S.shuffle ? 'true' : 'false'); // A11Y FIX 2b
  });
  $('btn-rep') && $('btn-rep').addEventListener('click', () => cycleRepeat('btn-rep'));

  qsa('.btn-sort').forEach(btn => {
    btn.addEventListener('click', () => {
      const by = btn.dataset.sort;

      if (by === 'default') {
        qsa('.btn-sort').forEach(b => {
          b.classList.remove('active');
          b.textContent = b.dataset.sort.toUpperCase();
        });
        btn.classList.add('active');
        S.sortDir = 'asc';
        doSort('default', 'asc');
        return;
      }

      if (S.sortBy === by) {
        S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        qsa('.btn-sort').forEach(b => {
          b.classList.remove('active');
          b.textContent = b.dataset.sort.toUpperCase();
        });
        S.sortDir = 'asc';
      }

      btn.classList.add('active');
      btn.textContent = by.toUpperCase() + (S.sortDir === 'asc' ? ' ▲' : ' ▼');
      doSort(by, S.sortDir);
    });
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case ' ':          e.preventDefault(); togglePlayPause(); break;
      case 'ArrowRight': nextTrack();         break;
      case 'ArrowLeft':  prevTrack();         break;
      case 's': case 'S': $('btn-shuf').click(); break;
      case 'r': case 'R': $('btn-rep').click();  break;
    }
  });

  window.addEventListener('resize', resizeCanvas);
}

/* ════════════════════════════════════════════════════════════════════
   THEME
════════════════════════════════════════════════════════════════════ */
function applyTheme(name, save) {
  S.theme = name;
  app.dataset.theme = name;
  updateVisColors();

  const label = name === 'winamp' ? '◈ WINAMP' : '◈ STUDIO';
  const themeBtn  = $('btn-theme');
  const themeBtn2 = $('btn-theme-d');
  if (themeBtn)  themeBtn.textContent  = label;
  if (themeBtn2) themeBtn2.textContent = label;

  $('pl-panel-title').textContent =
    name === 'winamp' ? 'WINAMP PLAYLIST' : window.SITE_NAME + ' PLAYLIST';

  if (save) {
    localStorage.setItem('msp-theme', name);
    burstSocials();
  }
}

/* ════════════════════════════════════════════════════════════════════
   LED TITLE SCROLLER
════════════════════════════════════════════════════════════════════ */
let titleTimer;

function setScrollTitle(text) {
  clearTimeout(titleTimer);

  ledTitle.classList.remove('scrolling');
  ledTitle.style.animation         = '';
  ledTitle.style.animationDuration = '';
  ledTitle.textContent             = text;

  titleTimer = setTimeout(() => {
    const padded = text + '\u00A0\u00A0\u00A0\u00A0\u25C6\u00A0\u00A0\u00A0\u00A0';
    ledTitle.textContent = padded + padded;

    void ledTitle.offsetWidth;

    const halfW = ledTitle.scrollWidth / 2;
    const dur   = Math.max(8, halfW / 28);
    ledTitle.style.animationDuration = `${dur.toFixed(1)}s`;
    ledTitle.classList.add('scrolling');
  }, 150);
}

/* ════════════════════════════════════════════════════════════════════
   INFO PANEL
════════════════════════════════════════════════════════════════════ */
function showInfo(t) {
  $('info-artist').textContent = t.artist  || '—';
  $('info-album' ).textContent = t.album   || '—';
  $('info-year'  ).textContent = t.year    || '—';
  $('info-notes' ).textContent = t.comment || '—';

  const fileEl = $('info-file');
  const fileRow = $('info-file-row');
  if (t.file && t.download_enabled) {
    const a = document.createElement('a');
    a.href        = 'music/' + t.file;
    a.download    = decodeURIComponent(t.file);
    a.textContent = '»download';
    a.className   = 'info-dl';
    a.setAttribute('aria-label', 'Download ' + decodeURIComponent(t.file));
    fileEl.innerHTML = '';
    fileEl.appendChild(a);
    if (fileRow) fileRow.style.display = '';
  } else {
    fileEl.textContent = '—';
    if (fileRow) fileRow.style.display = 'none';
  }

  const buyRow = $('info-buy-row');
  const buyEl  = $('info-buy');
  if (t.buy_url) {
    const a = document.createElement('a');
    a.href        = t.buy_url;
    a.target      = '_blank';
    a.rel         = 'noopener noreferrer';
    a.textContent = '»buy/support';
    a.className   = 'info-dl info-dl-buy';
    a.setAttribute('aria-label', 'Buy or support this release');
    buyEl.innerHTML = '';
    buyEl.appendChild(a);
    buyRow.style.display = '';
    attachSparkle(a);
  } else {
    buyEl.textContent    = '—';
    buyRow.style.display = 'none';
  }

  const infoRow = $('info-info-row');
  const infoEl  = $('info-info');
  if (t.info_url) {
    const a = document.createElement('a');
    a.href        = t.info_url;
    a.target      = '_blank';
    a.rel         = 'noopener noreferrer';
    a.textContent = '»more info';
    a.className   = 'info-dl';
    a.setAttribute('aria-label', 'More information about this track');
    infoEl.innerHTML = '';
    infoEl.appendChild(a);
    infoRow.style.display = '';
  } else {
    infoEl.textContent    = '—';
    infoRow.style.display = 'none';
  }

  const img = $('album-art');
  const ph  = $('art-ph');

  const shareCol = $('info-share-col');
  if (shareCol && t.file) {
    shareCol.style.display = 'flex';
    $('btn-share-link').onclick = e => { e.preventDefault(); openEmbedModal(t); };
    const iconBtn = $('btn-share-icon');
    if (iconBtn) {
      iconBtn.onclick = () => nativeShare(t);
      // Update aria-label with track name for context
      const trackName = t.title || decodeURIComponent(t.file);
      iconBtn.setAttribute('aria-label', `Share ${trackName}`);
    }
  }

  if (t.has_art) {
    // Set meaningful alt text from track metadata
    const altText = t.album
      ? `${t.album} album artwork`
      : (t.artist ? `${t.artist} artwork` : 'Album artwork');
    img.setAttribute('alt', altText);
    img.src = `art.php?f=${t.file}`;
    img.onload  = () => { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = () => { img.style.display = 'none';  ph.style.display = 'flex'; };

    img.classList.add('art-clickable');
    img.setAttribute('role', 'button');
    img.setAttribute('tabindex', '0');
    img.setAttribute('aria-label', `View larger ${altText}`);
  } else {
    img.setAttribute('alt', '');
    img.style.display = 'none';
    ph.style.display  = 'flex';

    img.classList.remove('art-clickable');
    img.removeAttribute('role');
    img.removeAttribute('tabindex');
    img.removeAttribute('aria-label');
  }
}

/* ════════════════════════════════════════════════════════════════════
   WEB AUDIO + VISUALIZER
════════════════════════════════════════════════════════════════════ */
let audioCtx, analyser, gainNode, visBuf = null, visRafId = null;
let visLedCol = '#14ff14';
let visDimCol = '#1a3a1a';

function updateVisColors() {
  const style = getComputedStyle(app);
  visLedCol = style.getPropertyValue('--led').trim() || '#14ff14';
  visDimCol = style.getPropertyValue('--led-dim').trim() || '#1a3a1a';
}

function hexToRgb(hex) {
  if (hex.length === 4) {
    return [parseInt(hex[1]+hex[1],16), parseInt(hex[2]+hex[2],16), parseInt(hex[3]+hex[3],16)];
  }
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function startVis() {
  if (visRafId) return;
  visRafId = requestAnimationFrame(visLoop);
}

function stopVis() {
  if (visRafId) { cancelAnimationFrame(visRafId); visRafId = null; }
  drawVis();
}

function visLoop() {
  drawVis();
  visRafId = requestAnimationFrame(visLoop);
}

function initVisualizer() {
  audio.addEventListener('play', () => {
    if (!isIOS) {
      if (!audioCtx) setupAudio();
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        audioCtx.resume().catch(() => {});
      }
    }
    startVis();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && audioCtx) {
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        audioCtx.resume().catch(() => {});
      }
    }
  });

  drawVis(); // draw one idle frame on load
}

function setupAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  gainNode = audioCtx.createGain();
  analyser.fftSize               = 64;
  analyser.smoothingTimeConstant = 0.78;
  gainNode.gain.value            = S.volume;   // apply current slider level
  visBuf = new Uint8Array(analyser.frequencyBinCount);
  const src = audioCtx.createMediaElementSource(audio);
  src.connect(gainNode);       // volume control first
  gainNode.connect(analyser);  // then visualiser
  analyser.connect(audioCtx.destination);
}

function drawVis() {
  const W = canvas.width;
  const H = canvas.height;

  ctx2d.clearRect(0, 0, W, H);

  if (!analyser || !visBuf) {
    const bars = 20, bw = Math.floor(W / bars) - 1;
    for (let i = 0; i < bars; i++) {
      ctx2d.fillStyle = visDimCol;
      ctx2d.fillRect(i * (bw + 1), H - 2, bw, 2);
    }
    return;
  }

  analyser.getByteFrequencyData(visBuf);

  const bars = Math.min(22, visBuf.length);
  const bw   = Math.max(1, Math.floor(W / bars) - 1);

  for (let i = 0; i < bars; i++) {
    const v  = visBuf[i] / 255;
    const bh = Math.max(2, Math.round(v * H));
    const x  = i * (bw + 1);

    if (v > 0.75)      ctx2d.fillStyle = '#ff3300';
    else if (v > 0.5)  ctx2d.fillStyle = '#ffaa00';
    else               ctx2d.fillStyle = visLedCol;

    ctx2d.fillRect(x, H - bh, bw, bh);

    ctx2d.fillStyle = v > 0.1 ? visLedCol : visDimCol;
    ctx2d.fillRect(x, H - bh - 1, bw, 1);
  }
}

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth  || 280;
  canvas.height = wrap.clientHeight || 42;
  drawVis();
}

/* ════════════════════════════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════════════════════════════ */
function fmtTime(s, long = false) {
  if (!s || isNaN(s) || s < 0) return long ? '0:00:00' : '0:00';
  s = Math.floor(s);
  const h   = Math.floor(s / 3600);
  const m   = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (long || h > 0) return `${h}:${pad(m)}:${pad(sec)}`;
  return `${m}:${pad(sec)}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function esc(str) {
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}

/* ════════════════════════════════════════════════════════════════════
   SPARKLE GALAXY
════════════════════════════════════════════════════════════════════ */
function attachSparkle(linkEl) {
  const wrap = document.createElement('span');
  wrap.className = 'buy-sparkle-wrap';
  linkEl.parentNode.insertBefore(wrap, linkEl);
  wrap.appendChild(linkEl);

  const H   = 34;
  const cvs = document.createElement('canvas');
  cvs.className = 'buy-sparkle-canvas';
  wrap.appendChild(cvs);
  const ctx = cvs.getContext('2d');

  requestAnimationFrame(() => {
    cvs.width  = wrap.offsetWidth  || 120;
    cvs.height = H;
  });

  const W_fallback = 120;
  function W() { return cvs.width || W_fallback; }

  function themeColors() {
    return app.dataset.theme === 'studio'
      ? ['#FAC946', '#fcd97c', '#007998']
      : ['#14ff14', '#00cc00', '#ffffff'];
  }

  const MARGIN = 22;
  let particles = [];
  let rafId     = null;
  let running   = false;

  function randomBetween(a, b) { return a + Math.random() * (b - a); }

  function edgeFade(p) {
    const w  = W();
    const fx = Math.min(p.x / MARGIN, (w - p.x) / MARGIN, 1);
    const fy = Math.min(p.y / MARGIN, (H - p.y) / MARGIN, 1);
    return Math.max(0, Math.min(fx, fy));
  }

  function spawnParticle() {
    const w = W();
    return {
      x:       randomBetween(0, w),
      y:       H / 2 + randomBetween(-3, 3),
      r:       randomBetween(0.5, 2.2),
      alpha:   randomBetween(0.5, 1.0),
      da:      randomBetween(-0.009, -0.004),
      dx:      randomBetween(-0.225, 0.225),
      dy:      randomBetween(-0.275, 0.275),
      rgb:     hexToRgb(themeColors()[Math.floor(Math.random() * 3)]),
      twinkle: Math.random() * Math.PI * 2,
    };
  }

  function drawFrame() {
    const w = W();
    ctx.clearRect(0, 0, w, H);

    if (particles.length < 28) {
      particles.push(spawnParticle());
      if (Math.random() > 0.75) particles.push(spawnParticle());
    }

    particles = particles.filter(p => p.alpha > 0);

    for (const p of particles) {
      const pulse = 0.85 + 0.15 * Math.sin(p.twinkle);
      p.twinkle += 0.12;
      const a = p.alpha * pulse * edgeFade(p);
      p.x += p.dx; p.y += p.dy; p.alpha += p.da;
      if (a < 0.02) continue;
      const [r, g, b] = p.rgb;
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.5);
      grd.addColorStop(0,   `rgba(${r},${g},${b},${a.toFixed(2)})`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},${(a*0.45).toFixed(2)})`);
      grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, a * 1.4).toFixed(2)})`;
      ctx.fill();
    }

    if (running) rafId = requestAnimationFrame(drawFrame);
  }

  function start() {
    if (running) return;
    running = true;
    cvs.classList.add('visible');
    particles = [];
    drawFrame();
  }

  function stop() {
    running = false;
    cvs.classList.remove('visible');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    setTimeout(() => { if (!running) ctx.clearRect(0, 0, W(), H); }, 220);
  }

  linkEl.addEventListener('mouseenter', start);
  linkEl.addEventListener('mouseleave', stop);
  linkEl.addEventListener('focus',      start);
  linkEl.addEventListener('blur',       stop);
}

/* ════════════════════════════════════════════════════════════════════
   SOCIALS BURST
════════════════════════════════════════════════════════════════════ */
function burstSocials() {
  const container = $('socials-icons');
  if (!container) return;

  let cvs = container.querySelector('.socials-burst-canvas');
  if (!cvs) {
    cvs = document.createElement('canvas');
    cvs.className = 'socials-burst-canvas';
    container.appendChild(cvs);
  }

  const W = container.offsetWidth  || 100;
  const H = container.offsetHeight || 22;
  cvs.width  = W;
  cvs.height = H;

  const ctx    = cvs.getContext('2d');
  const COLORS = app.dataset.theme === 'studio'
    ? ['#FAC946', '#F90002', '#007998']
    : ['#14ff14', '#00cc00', '#ffffff'];
  const MARGIN = 10;

  let particles = [];
  for (let i = 0; i < 55; i++) {
    particles.push({
      x:       Math.random() * W,
      y:       H / 2 + (Math.random() - 0.5) * H * 0.6,
      r:       0.5 + Math.random() * 2.0,
      alpha:   0.6 + Math.random() * 0.4,
      da:      -(0.008 + Math.random() * 0.012),
      dx:      (Math.random() - 0.5) * 0.6,
      dy:      (Math.random() - 0.5) * 0.5,
      rgb:     hexToRgb(COLORS[Math.floor(Math.random() * COLORS.length)]),
      twinkle: Math.random() * Math.PI * 2,
    });
  }

  let canvasAlpha = 1;
  const fadeRate  = 1 / (3.0 * 60);
  let rafId;

  cvs.style.opacity    = '1';
  cvs.style.transition = 'none';

  function edgeFade(p) {
    const fx = Math.min(p.x / MARGIN, (W - p.x) / MARGIN, 1);
    const fy = Math.min(p.y / MARGIN, (H - p.y) / MARGIN, 1);
    return Math.max(0, Math.min(fx, fy));
  }

  function draw() {
    canvasAlpha -= fadeRate;
    if (canvasAlpha <= 0) {
      cvs.style.opacity = '0';
      ctx.clearRect(0, 0, W, H);
      return;
    }
    cvs.style.opacity = canvasAlpha.toFixed(3);
    ctx.clearRect(0, 0, W, H);
    particles = particles.filter(p => p.alpha > 0);
    for (const p of particles) {
      const pulse = 0.85 + 0.15 * Math.sin(p.twinkle);
      p.twinkle += 0.1;
      const a = p.alpha * pulse * edgeFade(p);
      p.x += p.dx; p.y += p.dy; p.alpha += p.da;
      if (a < 0.02) continue;
      const [r, g, b] = p.rgb;
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.5);
      grd.addColorStop(0,   `rgba(${r},${g},${b},${a.toFixed(2)})`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},${(a*0.45).toFixed(2)})`);
      grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, a * 1.4).toFixed(2)})`;
      ctx.fill();
    }
    rafId = requestAnimationFrame(draw);
  }

  cvs.style.opacity = '1';
  draw();
}

/* ════════════════════════════════════════════════════════════════════
   SHARE & EMBED
════════════════════════════════════════════════════════════════════ */
// Site name shown in titles; replaced from site-config.php on load.
window.SITE_NAME = 'MPlayer';

const PLAYER_BASE = location.origin;

function trackDeepLink(t) {
  return `${PLAYER_BASE}/?t=${t.file}`;
}

function nativeShare(t) {
  const url   = trackDeepLink(t);
  const title = (t.artist && t.title) ? `${t.artist} — ${t.title}` : (t.title || decodeURIComponent(t.file));
  if (navigator.share) {
    navigator.share({ title, text: `Listen to ${title} on ${window.SITE_NAME}`, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).catch(() => {});
  }
}

function openEmbedModal(t) {
  const url       = trackDeepLink(t);
  const embedCode = `<iframe src="${PLAYER_BASE}/embed.php?t=${t.file}" width="100%" height="125" frameborder="0" style="border-radius:3px;max-width:640px;display:block"></iframe>`;

  $('embed-link-text').value = url;
  $('embed-code-text').value = embedCode;

  const modal = $('embed-modal');
  modal.style.display = 'flex';

  // Move focus to close button for keyboard/SR users
  requestAnimationFrame(() => $('embed-modal-close').focus());
}

$('embed-link-text').addEventListener('click', function() { this.select(); });
$('embed-code-text').addEventListener('click', function() { this.select(); });
$('embed-modal-close').addEventListener('click', closeEmbedModal);
$('embed-modal').addEventListener('click', e => {
  if (e.target === $('embed-modal')) closeEmbedModal();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeEmbedModal();
  closeArtModal();
});

function closeEmbedModal() {
  $('embed-modal').style.display = 'none';
  // Return focus to the element that opened the modal
  const trigger = $('btn-share-link') || $('btn-share-icon');
  if (trigger) trigger.focus();
}

function openArtModal() {
  const img = $('album-art');
  if (img.style.display !== 'block' || !img.src) return;

  $('art-modal-img').src = img.src;
  $('art-modal-img').alt = img.getAttribute('alt') || '';

  const modal = $('art-modal');
  modal.style.display = 'flex';

  requestAnimationFrame(() => $('art-modal-close').focus());
}

function closeArtModal() {
  const modal = $('art-modal');
  if (modal.style.display === 'none') return;
  modal.style.display = 'none';
  $('art-modal-img').src = '';
  $('album-art').focus();
}

$('album-art').addEventListener('click', openArtModal);
$('album-art').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    openArtModal();
  }
});
$('art-modal-close').addEventListener('click', closeArtModal);
$('art-modal').addEventListener('click', e => {
  if (e.target === $('art-modal')) closeArtModal();
});

<script>
(function () {
  'use strict';

  /* Which CSS custom properties each Customize-mode color controls.
     ponytail: only the base var per group is repointed — derived tint/glow
     vars (--chrome-hi/-lo, --led-glow, --led-dim, --btn-hi/-lo,
     --slider-thumb-hi/-lo) keep their original shade, so a very different
     custom color can look slightly flat on bevels/glows. Recompute those
     with real color math if that turns out to matter. */
  var DESIGN_VAR_GROUPS = {
    titlebar_color: ['--chrome', '--pl-now-text', '--btn-bg', '--info-val', '--slider-thumb-bg'],
    controls_dock_color: ['--titlebar-bg', '--led', '--pl-sel-bg', '--btn-active-col', '--sort-sel-bg'],
    pl_item_color: ['--pl-text']
  };
  var SOCIAL_IDS = { email: 'social-email', youtube: 'social-youtube', instagram: 'social-instagram', soundcloud: 'social-soundcloud', rss: 'social-rss' };
  var DEFAULT_DESIGN = {
    titlebar_color: '#FAC946', controls_dock_color: '#007998', pl_item_color: '#d4c07a',
    bg_image: '',
    bg_size: 'contain', bg_repeat_x: true, bg_repeat_y: true, bg_align: 'right', bg_fixed: false
  };
  var HEX_RE = /^#[0-9a-fA-F]{6}$/;
  // The theme's CSS custom properties (--chrome, --titlebar-bg, --pl-text, …)
  // are declared on #app via [data-theme="studio"], not on <html>/<body>.
  // Overriding them anywhere higher up the tree gets silently shadowed by
  // #app's own stylesheet declaration, since cascade resolution for a
  // property is per-element — an ancestor's inline value never beats an
  // element's own matching rule. So color overrides must target #app itself.
  var themeRoot = document.getElementById('app') || document.documentElement;

  function applyDesign(design) {
    if (!design) return;
    Object.keys(DESIGN_VAR_GROUPS).forEach(function (key) {
      var val = design[key];
      if (!val || !HEX_RE.test(val)) return;
      DESIGN_VAR_GROUPS[key].forEach(function (cssVar) { themeRoot.style.setProperty(cssVar, val); });
    });
    applyBackground(design);
  }

  function applyBackground(design) {
    // --bg-image is read directly by <body>, which is #app's ancestor, so
    // this one is set on body itself rather than themeRoot.
    if (design.bg_image) document.body.style.setProperty('--bg-image', "url('" + design.bg_image + "')");
    else document.body.style.removeProperty('--bg-image');
    if (design.bg_size) document.body.style.backgroundSize = design.bg_size;
    var rx = design.bg_repeat_x !== false, ry = design.bg_repeat_y !== false;
    document.body.style.backgroundRepeat = rx && ry ? 'repeat' : rx ? 'repeat-x' : ry ? 'repeat-y' : 'no-repeat';
    if (design.bg_align) document.body.style.backgroundPositionX = design.bg_align;
    document.body.style.backgroundAttachment = design.bg_fixed ? 'fixed' : 'scroll';
  }

  function applySocial(social) {
    if (!social) return;
    Object.keys(SOCIAL_IDS).forEach(function (key) {
      var el = document.getElementById(SOCIAL_IDS[key]);
      if (!el) return;
      var val = social[key];
      if (key === 'email') {
        el.hidden = !val;
        if (val) el.href = 'mailto:' + val;
        return;
      }
      el.hidden = !val;
      if (val) el.href = val;
    });
  }

  function initAdminBar() {
    fetch('customize_check.php').then(function (r) { return r.json(); }).then(function (auth) {
      if (!auth.loggedIn) return;
      var bar = document.createElement('div');
      bar.id = 'mp-admin-bar';
      bar.innerHTML =
        '<a href="upload.php">Upload</a>' +
        '<a href="library.php">Library</a>' +
        '<a href="index.html?customize=1" target="_blank" rel="noopener noreferrer">Customize</a>' +
        '<a href="settings.php">Settings</a>';
      document.body.prepend(bar);
      var app = document.getElementById('app');
      if (app) app.style.marginTop = bar.offsetHeight + 'px';
      document.documentElement.style.setProperty('--mp-admin-bar-h', bar.offsetHeight + 'px');
    }).catch(function () {});
  }

  function initCustomizeMode(cfg) {
    var params = new URLSearchParams(location.search);
    if (params.get('customize') !== '1') return;
    fetch('customize_check.php').then(function (r) { return r.json(); }).then(function (auth) {
      if (!auth.loggedIn) return;
      buildCustomizeModal(cfg || { social: {}, design: {} }, auth.csrf);
    });
  }

  function buildCustomizeModal(cfg, csrf) {
    var design = Object.assign({}, DEFAULT_DESIGN, cfg.design || {});
    var originalDesign = Object.assign({}, design);

    var overlay = document.createElement('div');
    overlay.id = 'mp-customize-overlay';
    overlay.innerHTML =
      '<div id="mp-customize-modal" role="dialog" aria-modal="true" aria-labelledby="mp-customize-title">'
      + '<header><h2 id="mp-customize-title">Customize</h2><button type="button" class="mp-close-btn" id="mp-customize-close" aria-label="Close">×</button></header>'
      + '<div class="mp-body">'
      + '<p class="mp-body-intro">Customize your player and preview your changes live before saving.</p>'
      + '<div class="mp-design-cols">'
      +   '<div id="mp-wheel"><div id="mp-wheel-ring" tabindex="0" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">'
      +     '<div class="mp-wheel-marker" id="mp-wheel-hue-marker"></div>'
      +     '<div id="mp-wheel-sv" tabindex="0" role="slider" aria-label="Saturation and brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">'
      +       '<div class="mp-wheel-marker" id="mp-wheel-sv-marker"></div>'
      +     '</div>'
      +   '</div></div>'
      +   '<div class="mp-color-fields">'
      +     '<div class="mp-row"><label for="mp-color-titlebar">Main Title Bar:</label><span class="mp-swatch-input"><span class="mp-swatch" id="mp-color-titlebar-swatch"></span><input type="text" id="mp-color-titlebar"></span></div>'
      +     '<div class="mp-row"><label for="mp-color-dock">Accent Controls Dock:</label><span class="mp-swatch-input"><span class="mp-swatch" id="mp-color-dock-swatch"></span><input type="text" id="mp-color-dock"></span></div>'
      +     '<div class="mp-row"><label for="mp-color-pl">Playlist Items:</label><span class="mp-swatch-input"><span class="mp-swatch" id="mp-color-pl-swatch"></span><input type="text" id="mp-color-pl"></span></div>'
      +     '<div class="mp-row mp-restore-link"><a href="#" id="mp-customize-restore">restore defaults</a></div>'
      +   '</div>'
      + '</div>'
      + '<div class="mp-row" id="mp-bg-current-row" hidden><span id="mp-bg-current">Background Image: <span id="mp-bg-filename"></span><a href="#" id="mp-bg-delete">delete</a></span></div>'
      + '<div class="mp-row"><label for="mp-bg-file">Background Image</label><input type="file" id="mp-bg-file" accept="image/jpeg,image/png,image/gif,image/webp"></div>'
      + '<div class="mp-row"><label for="mp-bg-size">Background Behavior</label><select id="mp-bg-size"><option value="contain">Default</option><option value="cover">Cover</option><option value="auto">Auto</option></select></div>'
      + '<div class="mp-row"><label id="mp-bg-repeat-label">Repeat</label><div class="mp-checkbox-group" role="group" aria-labelledby="mp-bg-repeat-label"><label><input type="checkbox" id="mp-bg-repeat-x"> Horizontally</label><label><input type="checkbox" id="mp-bg-repeat-y"> Vertically</label></div></div>'
      + '<div class="mp-row"><label for="mp-bg-align">Align</label><select id="mp-bg-align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div>'
      + '<div class="mp-row"><label><input type="checkbox" id="mp-bg-fixed"> Fixed position</label></div>'
      + '<div class="mp-error" id="mp-customize-error" hidden></div>'
      + '</div>'
      + '<footer><span class="mp-footer-spacer"></span><button type="button" class="mp-btn mp-btn-cancel" id="mp-customize-cancel">Cancel</button><button type="button" class="mp-btn mp-btn-save" id="mp-customize-save">Save</button></footer>'
      + '</div>';
    document.body.appendChild(overlay);

    var els = {
      titlebar: document.getElementById('mp-color-titlebar'), titlebarSwatch: document.getElementById('mp-color-titlebar-swatch'),
      dock: document.getElementById('mp-color-dock'), dockSwatch: document.getElementById('mp-color-dock-swatch'),
      pl: document.getElementById('mp-color-pl'), plSwatch: document.getElementById('mp-color-pl-swatch'),
      bgFile: document.getElementById('mp-bg-file'), bgSize: document.getElementById('mp-bg-size'),
      bgRepeatX: document.getElementById('mp-bg-repeat-x'), bgRepeatY: document.getElementById('mp-bg-repeat-y'),
      bgAlign: document.getElementById('mp-bg-align'), bgFixed: document.getElementById('mp-bg-fixed'),
      bgCurrentRow: document.getElementById('mp-bg-current-row'), bgFilename: document.getElementById('mp-bg-filename'),
      bgDelete: document.getElementById('mp-bg-delete'),
      wheelRing: document.getElementById('mp-wheel-ring'), wheelSv: document.getElementById('mp-wheel-sv'),
      hueMarker: document.getElementById('mp-wheel-hue-marker'), svMarker: document.getElementById('mp-wheel-sv-marker'),
      error: document.getElementById('mp-customize-error'),
      save: document.getElementById('mp-customize-save')
    };
    var colorFieldEls = { titlebar: els.titlebar, dock: els.dock, pl: els.pl };
    var colorSwatchEls = { titlebar: els.titlebarSwatch, dock: els.dockSwatch, pl: els.plSwatch };
    els.titlebar.value = design.titlebar_color;
    els.dock.value = design.controls_dock_color;
    els.pl.value = design.pl_item_color;
    els.bgSize.value = design.bg_size;
    els.bgRepeatX.checked = !!design.bg_repeat_x;
    els.bgRepeatY.checked = !!design.bg_repeat_y;
    els.bgAlign.value = design.bg_align;
    els.bgFixed.checked = !!design.bg_fixed;

    var pendingBgFile = null;
    // A data: URL, not an object URL — the site's CSP (img-src 'self' data:)
    // doesn't allow blob: images, so URL.createObjectURL() previews get
    // silently blocked on the real deployed site even though the CSS
    // property itself gets set correctly. data: URLs are already permitted.
    var pendingBgDataUrl = null;
    var pendingBgDeleted = false;

    /* ── hex <-> hsv, shared by the wheel and the hex text inputs ── */
    function hexToRgb(hex) {
      var n = parseInt(hex.slice(1), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(function (c) {
        return Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0');
      }).join('').toUpperCase();
    }
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      var h = 0;
      if (d !== 0) {
        if (max === r) h = 60 * (((g - b) / d) % 6);
        else if (max === g) h = 60 * ((b - r) / d + 2);
        else h = 60 * ((r - g) / d + 4);
      }
      if (h < 0) h += 360;
      return { h: h, s: max === 0 ? 0 : d / max, v: max };
    }
    function hsvToRgb(h, s, v) {
      var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
      if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
      return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
    }
    function hexToHsv(hex) { var rgb = hexToRgb(hex); return rgbToHsv(rgb.r, rgb.g, rgb.b); }
    function hsvToHex(h, s, v) { var rgb = hsvToRgb(h, s, v); return rgbToHex(rgb.r, rgb.g, rgb.b); }

    /* ── shared color wheel: edits whichever hex field last had focus ── */
    var activeField = 'titlebar';
    var wheel = { h: 0, s: 0, v: 1 };
    var RING_R = 85, RING_CENTER = 85, HUE_MARKER_R = 75, SV_SIZE = 100;

    function positionMarkers() {
      var rad = wheel.h * Math.PI / 180;
      els.hueMarker.style.left = (RING_CENTER + HUE_MARKER_R * Math.sin(rad)) + 'px';
      els.hueMarker.style.top = (RING_CENTER - HUE_MARKER_R * Math.cos(rad)) + 'px';
      els.svMarker.style.left = (wheel.s * SV_SIZE) + 'px';
      els.svMarker.style.top = ((1 - wheel.v) * SV_SIZE) + 'px';
      els.wheelSv.style.backgroundColor = hsvToHex(wheel.h, 1, 1);
      els.wheelRing.setAttribute('aria-valuenow', Math.round(wheel.h));
      els.wheelSv.setAttribute('aria-valuenow', Math.round(wheel.v * 100));
    }
    function syncWheelFromActive() {
      wheel = hexToHsv(colorFieldEls[activeField].value);
      positionMarkers();
    }
    function setActiveFromWheel() {
      var hex = hsvToHex(wheel.h, wheel.s, wheel.v);
      colorFieldEls[activeField].value = hex;
      updateSwatch(activeField);
      preview();
    }
    function updateSwatch(key) {
      var val = colorFieldEls[key].value;
      if (HEX_RE.test(val)) colorSwatchEls[key].style.backgroundColor = val;
    }

    Object.keys(colorFieldEls).forEach(function (key) {
      colorFieldEls[key].addEventListener('focus', function () { activeField = key; syncWheelFromActive(); });
      colorFieldEls[key].addEventListener('input', function () {
        if (HEX_RE.test(this.value)) { updateSwatch(key); if (activeField === key) syncWheelFromActive(); }
        preview();
      });
    });

    function ringHueFromEvent(e) {
      var rect = els.wheelRing.getBoundingClientRect();
      var dx = e.clientX - (rect.left + rect.width / 2), dy = e.clientY - (rect.top + rect.height / 2);
      var deg = Math.atan2(dx, -dy) * 180 / Math.PI;
      return deg < 0 ? deg + 360 : deg;
    }
    function svFromEvent(e) {
      var rect = els.wheelSv.getBoundingClientRect();
      var s = (e.clientX - rect.left) / rect.width, v = 1 - (e.clientY - rect.top) / rect.height;
      return { s: Math.max(0, Math.min(1, s)), v: Math.max(0, Math.min(1, v)) };
    }
    function dragWheel(el, onMove) {
      el.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        el.setPointerCapture(e.pointerId);
        onMove(e);
        function move(ev) { onMove(ev); }
        function up(ev) {
          el.releasePointerCapture(ev.pointerId);
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
        }
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
      });
    }
    dragWheel(els.wheelRing, function (e) { wheel.h = ringHueFromEvent(e); positionMarkers(); setActiveFromWheel(); });
    dragWheel(els.wheelSv, function (e) { var sv = svFromEvent(e); wheel.s = sv.s; wheel.v = sv.v; positionMarkers(); setActiveFromWheel(); });
    els.wheelRing.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      wheel.h = (wheel.h + (e.key === 'ArrowRight' ? 2 : -2) + 360) % 360;
      positionMarkers(); setActiveFromWheel(); e.preventDefault();
    });
    els.wheelSv.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') wheel.s = Math.max(0, wheel.s - 0.02);
      else if (e.key === 'ArrowRight') wheel.s = Math.min(1, wheel.s + 0.02);
      else if (e.key === 'ArrowUp') wheel.v = Math.min(1, wheel.v + 0.02);
      else if (e.key === 'ArrowDown') wheel.v = Math.max(0, wheel.v - 0.02);
      else return;
      positionMarkers(); setActiveFromWheel(); e.preventDefault();
    });

    function bgFilename(path) {
      if (!path) return '';
      return path.split('/').pop().split('?')[0];
    }
    function updateBgCurrentRow() {
      if (pendingBgFile) { els.bgFilename.textContent = pendingBgFile.name; els.bgCurrentRow.hidden = false; }
      else if (pendingBgDeleted) { els.bgCurrentRow.hidden = true; }
      else if (design.bg_image) { els.bgFilename.textContent = bgFilename(design.bg_image); els.bgCurrentRow.hidden = false; }
      else { els.bgCurrentRow.hidden = true; }
    }

    function preview() {
      applyDesign({
        titlebar_color: els.titlebar.value,
        controls_dock_color: els.dock.value,
        pl_item_color: els.pl.value,
        bg_image: pendingBgDeleted && !pendingBgFile ? '' : (pendingBgDataUrl || design.bg_image),
        bg_size: els.bgSize.value,
        bg_repeat_x: els.bgRepeatX.checked,
        bg_repeat_y: els.bgRepeatY.checked,
        bg_align: els.bgAlign.value,
        bg_fixed: els.bgFixed.checked
      });
    }

    els.bgSize.addEventListener('change', preview);
    els.bgRepeatX.addEventListener('change', preview);
    els.bgRepeatY.addEventListener('change', preview);
    els.bgAlign.addEventListener('change', preview);
    els.bgFixed.addEventListener('change', preview);
    els.bgFile.addEventListener('change', function () {
      pendingBgFile = this.files[0] || null;
      pendingBgDataUrl = null;
      pendingBgDeleted = false;
      updateBgCurrentRow();
      if (!pendingBgFile) { preview(); return; }
      var reader = new FileReader();
      reader.onload = function () { pendingBgDataUrl = reader.result; preview(); };
      reader.readAsDataURL(pendingBgFile);
    });
    els.bgDelete.addEventListener('click', function (e) {
      e.preventDefault();
      pendingBgDeleted = true;
      pendingBgFile = null;
      pendingBgDataUrl = null;
      els.bgFile.value = '';
      updateBgCurrentRow();
      preview();
    });

    function resetToDefaults() {
      els.titlebar.value = DEFAULT_DESIGN.titlebar_color; updateSwatch('titlebar');
      els.dock.value = DEFAULT_DESIGN.controls_dock_color; updateSwatch('dock');
      els.pl.value = DEFAULT_DESIGN.pl_item_color; updateSwatch('pl');
      els.bgSize.value = DEFAULT_DESIGN.bg_size;
      els.bgRepeatX.checked = DEFAULT_DESIGN.bg_repeat_x;
      els.bgRepeatY.checked = DEFAULT_DESIGN.bg_repeat_y;
      els.bgAlign.value = DEFAULT_DESIGN.bg_align;
      els.bgFixed.checked = DEFAULT_DESIGN.bg_fixed;
      pendingBgFile = null;
      pendingBgDataUrl = null;
      pendingBgDeleted = false;
      els.bgFile.value = '';
      design.bg_image = DEFAULT_DESIGN.bg_image;
      updateBgCurrentRow();
      syncWheelFromActive();
      preview();
    }

    function closeModal() {
      overlay.remove();
      badge.remove();
    }

    function cancel() {
      if (originalDesign.bg_image) document.body.style.setProperty('--bg-image', "url('" + originalDesign.bg_image + "')");
      else document.body.style.removeProperty('--bg-image');
      applyDesign(originalDesign);
      closeModal();
    }

    document.getElementById('mp-customize-close').addEventListener('click', cancel);
    document.getElementById('mp-customize-cancel').addEventListener('click', cancel);
    document.getElementById('mp-customize-restore').addEventListener('click', function (e) { e.preventDefault(); resetToDefaults(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cancel(); });
    document.addEventListener('keydown', function onEsc(e) {
      if (e.key === 'Escape' && document.body.contains(overlay)) { cancel(); document.removeEventListener('keydown', onEsc); }
    });

    els.save.addEventListener('click', function () {
      els.error.hidden = true;
      els.save.disabled = true;

      var uploadStep = pendingBgFile
        ? (function () {
            var ufd = new FormData();
            ufd.set('csrf', csrf);
            ufd.set('image', pendingBgFile);
            return fetch('background_upload.php', { method: 'POST', body: ufd })
              .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
          })()
        : Promise.resolve({ ok: true, data: { path: null } });

      uploadStep.then(function (res) {
        if (!res.ok) throw new Error(res.data.error || 'Background upload failed.');
        var fd = new FormData();
        fd.set('section', 'design');
        fd.set('csrf', csrf);
        fd.set('titlebar_color', els.titlebar.value);
        fd.set('controls_dock_color', els.dock.value);
        fd.set('pl_item_color', els.pl.value);
        fd.set('bg_image', res.data.path || (pendingBgDeleted ? '' : design.bg_image));
        fd.set('bg_size', els.bgSize.value);
        if (els.bgRepeatX.checked) fd.set('bg_repeat_x', '1');
        if (els.bgRepeatY.checked) fd.set('bg_repeat_y', '1');
        fd.set('bg_align', els.bgAlign.value);
        if (els.bgFixed.checked) fd.set('bg_fixed', '1');
        return fetch('settings_save.php', { method: 'POST', body: fd })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
      }).then(function (res) {
        if (!res.ok) throw new Error(res.data.error || 'Save failed.');
        closeModal();
      }).catch(function (err) {
        els.error.hidden = false;
        els.error.textContent = err.message;
      }).finally(function () {
        els.save.disabled = false;
      });
    });

    updateSwatch('titlebar'); updateSwatch('dock'); updateSwatch('pl');
    updateBgCurrentRow();
    syncWheelFromActive();
    preview();
  }

  initAdminBar();

  function applySiteName(name) {
    name = (name || '').trim() || 'MPlayer';
    window.SITE_NAME = name;
    var label = document.getElementById('titlebar-label');
    if (label) label.textContent = name;
    var plTitle = document.getElementById('pl-panel-title');
    if (plTitle && (document.getElementById('app') || {}).dataset.theme !== 'winamp') {
      plTitle.textContent = name + ' PLAYLIST';
    }
    // Only reclaim the tab title when nothing is playing — playTrack()
    // owns it otherwise.
    if (document.title.indexOf('▶') !== 0) document.title = name;
  }

  fetch('site-config.php').then(function (r) { return r.json(); }).then(function (cfg) {
    applySiteName(cfg.site_name);
    applySocial(cfg.social);
    applyDesign(cfg.design);
    initCustomizeMode(cfg);
  }).catch(function () { initCustomizeMode(null); });
})();
</script>

</body>
</html>
