<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art Lab</title>
<style>
/* Layout: one column — square preview on top, controls beneath (phone first).
   Colours mirror the player's default theme; the four swatches below are the
   same four Customize colours the player uses for its generated artwork. */
:root {
  --bg: #141410;
  --panel: #1d1d17;
  --line: #554e30;
  --fg: #d4c07a;
  --muted: #9a8c58;
  --accent: #FAC946;
  --accent-ink: #2a2000;
  --focus: #6fd6ef;
  color-scheme: dark;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 16px 40px;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--mono);
}
main { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
#stage {
  width: 100%; aspect-ratio: 1; max-width: 100%;
  border: 1px solid var(--line);
  background: #000;
  position: relative;
}
#stage canvas { width: 100% !important; height: 100% !important; display: block; }
#err { padding: 16px; color: #ff9a8a; font-size: 13px; }
section { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.row label { min-width: 0; }
.row output { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 3.5ch; text-align: right; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
input[type=text], select {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 0; font: inherit;
}
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatch { display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; align-items: center; min-width: 0; }
.swatch input[type=color] { grid-row: span 2; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); background: none; }
.swatch label { font-size: 13px; line-height: 1.2; }
.swatch code { font-size: 12px; color: var(--muted); }
button {
  min-height: 44px; padding: 8px 14px; border: 0; border-radius: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700;
}
button:active { filter: brightness(.9); }
.link { background: none; color: var(--muted); font-weight: 400; text-decoration: underline; min-height: 32px; padding: 4px 0; text-align: left; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.foot { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Art Lab</h1>
    <p class="sub">Brush-drawn placeholder artwork for tracks with no cover. Experiment page, not wired into the player.</p>
  </header>

  <div id="stage" role="img" aria-label="Generated artwork preview"></div>

  <section aria-labelledby="h-colors">
    <h2 id="h-colors">Colors</h2>
    <div class="pair">
      <div class="swatch"><input type="color" id="c-accent" value="#fac946"><label for="c-accent">Accent Color</label><code id="x-accent"></code></div>
      <div class="swatch"><input type="color" id="c-dock" value="#007998"><label for="c-dock">Title Bar &amp; Highlights</label><code id="x-dock"></code></div>
      <div class="swatch"><input type="color" id="c-pl" value="#d4c07a"><label for="c-pl">Playlist Text</label><code id="x-pl"></code></div>
      <div class="swatch"><input type="color" id="c-bg" value="#141410"><label for="c-bg">Background</label><code id="x-bg"></code></div>
    </div>
    <button type="button" id="randomize">Randomize Colors</button>
    <button type="button" class="link" id="restore">restore defaults</button>
  </section>

  <section aria-labelledby="h-shape">
    <h2 id="h-shape">Pattern</h2>
    <div class="field">
      <label for="seed">Album or filename (seed)</label>
      <input type="text" id="seed" value="Untitled Album" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="row"><label for="tiles">Tiles per side</label><output id="o-tiles"></output><input type="range" id="tiles" min="2" max="8" step="1" value="4"></div>
    <div class="row"><label for="mix">Shape mix (0 circles, 100 lines)</label><output id="o-mix"></output><input type="range" id="mix" min="0" max="100" step="1" value="50"></div>
    <div class="row"><label for="size">Shape size</label><output id="o-size"></output><input type="range" id="size" min="30" max="100" step="1" value="80"></div>
  </section>

  <section aria-labelledby="h-brush">
    <h2 id="h-brush">Brush</h2>
    <div class="field"><label for="brushName">Stroke brush</label><select id="brushName"></select></div>
    <div class="field"><label for="fieldName">Flow field</label><select id="fieldName"></select></div>
    <div class="row"><label for="scale">Brush scale</label><output id="o-scale"></output><input type="range" id="scale" min="1" max="8" step="0.1" value="5"></div>
    <div class="row"><label for="weight">Stroke weight</label><output id="o-weight"></output><input type="range" id="weight" min="0.2" max="3" step="0.1" value="1.6"></div>
    <div class="row"><label for="wiggle">Wobble</label><output id="o-wiggle"></output><input type="range" id="wiggle" min="0" max="10" step="0.5" value="2"></div>
  </section>

  <section aria-labelledby="h-fill">
    <h2 id="h-fill">Fill and hatch</h2>
    <div class="row"><label for="opacity">Fill opacity</label><output id="o-opacity"></output><input type="range" id="opacity" min="20" max="255" step="1" value="150"></div>
    <div class="row"><label for="bleed">Watercolor bleed</label><output id="o-bleed"></output><input type="range" id="bleed" min="0" max="1" step="0.05" value="0.3"></div>
    <div class="row"><label for="texture">Paper texture</label><output id="o-texture"></output><input type="range" id="texture" min="0" max="1" step="0.05" value="0.5"></div>
    <div class="row"><label for="hatchGap">Hatch spacing</label><output id="o-hatchGap"></output><input type="range" id="hatchGap" min="3" max="30" step="1" value="9"></div>
    <div class="row"><label for="hatchAngle">Hatch angle</label><output id="o-hatchAngle"></output><input type="range" id="hatchAngle" min="0" max="180" step="1" value="45"></div>
  </section>

  <p class="foot">Drawn with p5.brush (MIT, Alejandro Campos Uribe). Needs WebGL2.</p>
</main>

<script src="lib/brush.js"></script>
<script>
(function () {
  'use strict';

  /* ── Colors: same four slots, defaults and randomizer as index.html's Customize modal ── */
  var DEFAULTS = { accent: '#FAC946', dock: '#007998', pl: '#D4C07A', bg: '#141410' };
  var COLOR_KEYS = ['accent', 'dock', 'pl', 'bg'];

  function hexToRgb(hex) { var n = parseInt(hex.slice(1), 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; }
  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(function (c) { return Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }
  function hsvToRgb(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
    if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
    return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
  }
  function hsvToHex(h, s, v) { var rgb = hsvToRgb(h, s, v); return rgbToHex(rgb.r, rgb.g, rgb.b); }
  function lin(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function lum(hex) { var c = hexToRgb(hex); return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b); }
  function contrast(a, b) { var la = lum(a), lb = lum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }

  // Same rule as the player: only the pairs actually drawn together must clear 4.5:1
  // (Accent on Dock, Accent on Background, Playlist Text on Background).
  function randomPalette() {
    var a, b, c, d;
    function randHex() { return hsvToHex(Math.random() * 360, 0.55 + Math.random() * 0.4, 0.15 + Math.random() * 0.8); }
    for (var i = 0; i < 3000; i++) {
      a = randHex(); b = randHex(); c = randHex(); d = randHex();
      if (contrast(a, b) >= 4.5 && contrast(a, d) >= 4.5 && contrast(c, d) >= 4.5) break;
    }
    return { accent: a, dock: b, pl: c, bg: d };
  }

  /* ── Elements ── */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var SLIDERS = ['tiles', 'mix', 'size', 'scale', 'weight', 'wiggle', 'opacity', 'bleed', 'texture', 'hatchGap', 'hatchAngle'];

  /* ── Canvas ── */
  var SIZE = 600; // internal drawing units; CSS scales it to the column
  var ok = false;
  try {
    brush.createCanvas(SIZE, SIZE, { parent: stage, pixelDensity: Math.min(window.devicePixelRatio || 1, 2) });
    brush.angleMode(brush.DEGREES);
    ok = true;
  } catch (e) {
    stage.innerHTML = '<div id="err">This browser could not start WebGL2, which the brush library needs. ' + String(e.message || e) + '</div>';
  }

  /* Populate brush / field menus from the library itself. */
  var BRUSHES = ['2B', 'HB', '2H', 'cpencil', 'pen', 'rotring', 'spray', 'marker', 'marker2', 'charcoal'];
  var FIELDS = ['none'];
  try { FIELDS = FIELDS.concat(brush.listFields().filter(function (n) { return n !== 'hand'; })); } catch (e) {}
  function fillSelect(el, items, sel) {
    items.forEach(function (n) { var o = document.createElement('option'); o.value = o.textContent = n; if (n === sel) o.selected = true; el.appendChild(o); });
  }
  fillSelect($('brushName'), BRUSHES, 'HB');
  fillSelect($('fieldName'), FIELDS, 'none');

  /* ── Seeded randomness: same seed text always gives the same layout ── */
  function hashSeed(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    h ^= h >>> 16; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16;
    return h >>> 0;
  }
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ── State ── */
  function readState() {
    var s = { seed: $('seed').value || 'Untitled Album', brushName: $('brushName').value, fieldName: $('fieldName').value, colors: {} };
    SLIDERS.forEach(function (k) { s[k] = parseFloat($(k).value); });
    COLOR_KEYS.forEach(function (k) { s.colors[k] = $('c-' + k).value; });
    return s;
  }

  /* ── Drawing ──
     Each tile gets one of five marks; the Shape mix slider shifts the odds from
     filled circles towards hatched and line work. Colors alternate in a checker
     between Accent and Title Bar & Highlights, with Playlist Text as the third ink. */
  function draw(s) {
    var rnd = mulberry(hashSeed('album:' + s.seed));
    var seedNum = hashSeed('brush:' + s.seed);
    var n = s.tiles, cell = SIZE / n;
    var A = s.colors.accent, B = s.colors.dock, C = s.colors.pl;

    brush.seed(seedNum);
    brush.noiseSeed(seedNum);
    brush.clear(s.colors.bg);
    brush.scaleBrushes(s.scale);

    brush.push();
    brush.translate(-SIZE / 2, -SIZE / 2);

    if (s.fieldName !== 'none') brush.field(s.fieldName); else brush.noField();
    brush.wiggle(s.wiggle);

    var r = cell / 2 * (s.size / 100);
    for (var j = 0; j < n; j++) {
      for (var i = 0; i < n; i++) {
        var cx = (i + 0.5) * cell, cy = (j + 0.5) * cell;
        var inkA = (i + j) % 2 === 0 ? A : B, inkB = (i + j) % 2 === 0 ? B : A;
        var t = rnd() * 100;
        var kind = t < s.mix * 0.4 ? 'hatch' : t < s.mix * 0.7 ? 'cross' : t < 55 + s.mix * 0.2 ? 'disc' : 'ring';

        brush.noFill(); brush.noHatch(); brush.noStroke();
        if (kind === 'disc') {
          brush.fill(inkA, s.opacity);
          brush.fillBleed(s.bleed);
          brush.fillTexture(s.texture, 0.4);
          brush.set(s.brushName, inkB, s.weight);
          brush.circle(cx, cy, r);
        } else if (kind === 'ring') {
          brush.set(s.brushName, inkA, s.weight * 1.4);
          brush.circle(cx, cy, r);
          brush.fill(C, s.opacity * 0.8);
          brush.fillBleed(s.bleed);
          brush.noStroke();
          brush.circle(cx, cy, r * 0.35);
        } else if (kind === 'hatch') {
          brush.hatchStyle(s.brushName, inkB, s.weight);
          brush.hatch(s.hatchGap, s.hatchAngle + (rnd() < 0.5 ? 0 : 90), { rand: 0.05 });
          brush.set(s.brushName, inkA, s.weight);
          brush.rect(cx - r, cy - r, r * 2, r * 2, 'corner');
        } else {
          brush.set(s.brushName, inkA, s.weight * 1.2);
          brush.line(cx - r, cy - r, cx + r, cy + r);
          brush.set(s.brushName, C, s.weight);
          brush.line(cx - r, cy + r, cx + r, cy - r);
        }
      }
    }

    brush.noField();
    brush.pop();
    brush.render();
  }

  /* ── Wiring ── */
  var pending = false;
  function schedule() {
    if (pending || !ok) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; draw(readState()); });
  }
  function syncReadouts() {
    SLIDERS.forEach(function (k) { $('o-' + k).textContent = $(k).value; });
    COLOR_KEYS.forEach(function (k) { $('x-' + k).textContent = $('c-' + k).value.toUpperCase(); });
  }
  function setColors(p) { COLOR_KEYS.forEach(function (k) { $('c-' + k).value = p[k].toLowerCase(); }); }
  function changed() { syncReadouts(); schedule(); }

  SLIDERS.forEach(function (k) { $(k).addEventListener('input', changed); });
  COLOR_KEYS.forEach(function (k) { $('c-' + k).addEventListener('input', changed); });
  ['seed', 'brushName', 'fieldName'].forEach(function (k) { $(k).addEventListener('input', changed); });
  $('randomize').addEventListener('click', function () { setColors(randomPalette()); changed(); });
  $('restore').addEventListener('click', function () { setColors(DEFAULTS); changed(); });

  syncReadouts();
  schedule();
})();
</script>
</body>
</html>
